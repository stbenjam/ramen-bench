schema_version = "1.3"
artifacts = ["/app/index.html"]

[task]
name = "stbenjam/ramen"
version = "1.0.0"
description = "Create a polished, interactive bowl of vegan ramen in one dependency-free HTML file."
keywords = ["creative-coding", "html", "canvas"]

[metadata]
category = "creative-coding"
tags = ["html", "visual", "vegan-ramen"]

[agent]
timeout_sec = 10800.0

[environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 512
storage_mb = 1024
