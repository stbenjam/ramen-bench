      cg.addColorStop(0.75, '#ff6a3c');
      cg.addColorStop(1, '#b41c0e');
      g.strokeStyle = cg;
      g.lineWidth = Math.max(0.95, th.thick * (R / 215));
      g.beginPath();
      g.moveTo(p0.x, p0.y);
      g.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      g.stroke();
    }
    g.restore();
  }

  // =========================================================================
  // Seamless Photographic Volumetric Steam Renderer (Offscreen Soft-Blur Layer)
  // =========================================================================
  function renderSteamLayer(bowlX, bowlY, lightShiftX) {
    const sg = cache.steamCtx;
    const sc = cache.steamScale;
    const sw = cache.steamLayer.width;
    const sh = cache.steamLayer.height;
    const R = L.R;
    const beamCenterX = lightShiftX * R * 0.25;

    sg.save();
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, sw, sh);
    sg.scale(sc, sc);
    sg.translate(bowlX, bowlY);
    sg.globalCompositeOperation = 'source-over';

    // 1) Delicate low-lying warm vapor mist hugging the hot broth surface (never washing out toppings!)
    const hazeGrad = sg.createRadialGradient(0, L.brothOffY - R * 0.14, R * 0.08, 0, L.brothOffY - R * 0.22, R * 0.90);
    hazeGrad.addColorStop(0, `rgba(255, 224, 174, ${0.075 + ptr.warmthBoost * 0.04})`);
    hazeGrad.addColorStop(0.55, `rgba(255, 212, 162, ${0.032 + ptr.warmthBoost * 0.02})`);
    hazeGrad.addColorStop(1, 'rgba(255, 212, 162, 0)');
    sg.fillStyle = hazeGrad;
    sg.beginPath();
    sg.ellipse(0, L.brothOffY - R * 0.18, R * 0.90, R * 0.42, 0, 0, Math.PI * 2);
    sg.fill();

    // 2) Billowing Volumetric Vapor Plumes (soft organic cloud puffs)
    for (let i = 0; i < steamPuffs.length; i++) {
      const p = steamPuffs[i];
      const lifeT = clamp(p.age / p.maxLife, 0, 1);
      // Graceful fade-in near broth, soft bloom, complete dissolution before top edge!
      const screenY = bowlY + p.y;
      const topFade = smoothstep(H * 0.04, H * 0.26, screenY);
      const env = smoothstep(0, 0.18, lifeT) * (1 - smoothstep(0.38, 1.0, lifeT)) * topFade;
      if (env <= 0.002) continue;

      const beamDist = Math.abs(p.x - beamCenterX) / (R * 1.25);
      const beamBoost = 0.52 + 0.65 * Math.exp(-beamDist * beamDist * 1.2);
      const alpha = p.alphaMax * env * beamBoost * (1 + ptr.warmthBoost * 0.28);

      const size = p.baseSize * (0.68 + lifeT * 1.85);
      const stretchY = 1.10 + (1 - lifeT) * 0.35;
      const tilt = clamp(p.vx * 0.009, -0.55, 0.55);

      sg.save();
      sg.translate(p.x, p.y);
      sg.rotate(tilt + p.rot * 0.16);
      sg.scale(1.0, stretchY);
      sg.globalAlpha = clamp(alpha, 0, 0.34);
      sg.drawImage(cache.steamBrushes[p.brush], -size * 0.5, -size * 0.5, size, size);
      sg.restore();
    }

    // 3) Seamless Tapered Silk Vapor Ribbons (SINGLE closed polygon per ribbon — ZERO beading!)
    sg.globalAlpha = 1;
    for (let r = 0; r < steamRibbons.length; r++) {
      const rb = steamRibbons[r];
      const pts = rb.pts;
      const n = pts.length;
      if (n < 5) continue;

      let minY = Infinity;
      let maxY = -Infinity;
      for (let s = 0; s < n; s++) {
        const py = pts[s].y;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
      }

      if (maxY - minY < 12) continue;

      const midX = pts[n >> 1].x;
      const beamDist = Math.abs(midX - beamCenterX) / (R * 1.15);
      const beamLit = 0.55 + 0.65 * Math.exp(-beamDist * beamDist * 1.3);
      const peakA = clamp(rb.alpha * beamLit * (1 + ptr.warmthBoost * 0.30), 0, 0.24);

      // Outer feathery silk ribbon + delicate luminous curling core!
      for (let pass = 0; pass < 2; pass++) {
        const isCore = pass === 1;
        const wScale = isCore ? 0.34 : 1.0;
        const aScale = isCore ? 0.82 : 0.62;
        const lp = [];
        const rp = [];
        for (let s = 0; s < n; s++) {
          const frac = s / (n - 1);
          const p = pts[s];
          const pPrev = pts[Math.max(0, s - 1)];
          const pNext = pts[Math.min(n - 1, s + 1)];
          const tx = pNext.x - pPrev.x;
          const ty = pNext.y - pPrev.y;
          const tLen = Math.hypot(tx, ty) || 1;
          const nx = -ty / tLen;
          const ny = tx / tLen;
          const halfW = rb.widthBase * (0.28 + Math.sin(frac * Math.PI * 0.85) * 1.15 + frac * 0.72) * wScale;
          lp.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
          rp.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });
        }

        const pa = peakA * aScale;
        const grad = sg.createLinearGradient(0, maxY, 0, minY);
        grad.addColorStop(0.0, 'rgba(255, 224, 174, 0)');
        grad.addColorStop(0.14, `rgba(255, 228, 184, ${pa * 0.86})`);
        grad.addColorStop(0.38, `rgba(255, 238, 210, ${pa})`);
        grad.addColorStop(0.74, `rgba(246, 238, 228, ${pa * 0.42})`);
        grad.addColorStop(1.0, 'rgba(242, 238, 232, 0)');

        sg.fillStyle = grad;
        sg.beginPath();
        sg.moveTo(lp[0].x, lp[0].y);
        for (let s = 1; s < n - 1; s++) {
          const mx = (lp[s].x + lp[s + 1].x) * 0.5;
          const my = (lp[s].y + lp[s + 1].y) * 0.5;
          sg.quadraticCurveTo(lp[s].x, lp[s].y, mx, my);
        }
        sg.lineTo(lp[n - 1].x, lp[n - 1].y);
        sg.lineTo(rp[n - 1].x, rp[n - 1].y);
        for (let s = n - 2; s >= 1; s--) {
          const mx = (rp[s].x + rp[s - 1].x) * 0.5;
          const my = (rp[s].y + rp[s - 1].y) * 0.5;
          sg.quadraticCurveTo(rp[s].x, rp[s].y, mx, my);
        }
        sg.lineTo(rp[0].x, rp[0].y);
        sg.closePath();
        sg.fill();
      }
    }

    // SINGLE full-canvas destination-in fade mask so steam dissolves smoothly before top border!
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.globalCompositeOperation = 'destination-in';
    const topMask = sg.createLinearGradient(0, 0, 0, sh);
    topMask.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
    topMask.addColorStop(0.09, 'rgba(0, 0, 0, 0.25)');
    topMask.addColorStop(0.24, 'rgba(0, 0, 0, 0.92)');
    topMask.addColorStop(0.32, 'rgba(0, 0, 0, 1)');
    topMask.addColorStop(1.0, 'rgba(0, 0, 0, 1)');
    sg.fillStyle = topMask;
    sg.fillRect(0, 0, sw, sh);

    sg.restore();

    // Composite the soft volumetric steam onto the main scene with dual-pass feathery glow!
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    // Soft enveloping mist pass
    ctx.filter = 'blur(8px)';
    ctx.globalAlpha = 0.76;
    ctx.drawImage(cache.steamLayer, 0, 0, W, H);
    // Finer silky curling wisp pass
    ctx.filter = 'blur(2px)';
    ctx.globalAlpha = 0.56;
    ctx.drawImage(cache.steamLayer, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.restore();
  }

  // Seamless Warm Overhead Atmospheric Glow & Floating Bokeh Motes (ZERO hard cone edges!)
  function drawOverheadLightAndMotes(g, timeSec, lightShiftX) {
    const R = L.R;
    const sway = reducedMotion ? 0 : Math.sin(timeSec * 0.36) * R * 0.05;
    const lampX = L.cx - R * 0.10 + sway + lightShiftX * R * 0.24;
    const boost = 1 + ptr.warmthBoost * 0.26;

    g.save();
    g.globalCompositeOperation = 'screen';

    // 1) Seamless soft overhead pendant glow shaft (pure smooth elliptical radial falloff!)
    g.save();
    g.translate(lampX, L.cy - R * 1.12);
    g.scale(1.05, 1.85);
    const shaftR = R * 1.48;
    const shaft = g.createRadialGradient(0, 0, R * 0.08, 0, 0, shaftR);
    shaft.addColorStop(0, `rgba(255, 192, 112, ${0.115 * boost})`);
    shaft.addColorStop(0.32, `rgba(242, 158, 72, ${0.062 * boost})`);
    shaft.addColorStop(0.68, `rgba(198, 108, 38, ${0.020 * boost})`);
    shaft.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = shaft;
    g.beginPath();
    g.arc(0, 0, shaftR, 0, Math.PI * 2);
    g.fill();
    g.restore();

    // 2) Intimate warm radiance rising directly from the hot ramen bowl
    const brothAura = g.createRadialGradient(
      L.cx - R * 0.04, L.cy - R * 0.14, R * 0.12,
      L.cx, L.cy - R * 0.08, R * 1.58
    );
    brothAura.addColorStop(0, `rgba(255, 178, 86, ${0.10 * boost})`);
    brothAura.addColorStop(0.45, `rgba(218, 118, 42, ${0.038 * boost})`);
    brothAura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = brothAura;
    g.beginPath();
    g.arc(L.cx, L.cy - R * 0.08, R * 1.58, 0, Math.PI * 2);
    g.fill();

    // 3) Subtle warm golden bokeh dust motes drifting lazily in the light
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const mx = L.cx + m.nx * R * 1.15 - ptr.nx * 10;
      const my = L.cy + m.ny * R * 0.86 - ptr.ny * 8;
      if (my < -20 || my > H + 20) continue;

      const beamDist = Math.abs(mx - (L.cx + lightShiftX * R * 0.2)) / (R * 1.25);
      const twinkle = reducedMotion ? 0.8 : (0.55 + 0.45 * Math.sin(timeSec * 1.4 + m.phase));
      const a = m.alpha * twinkle * Math.exp(-beamDist * beamDist * 1.2) * smoothstep(0, H * 0.22, my);
      if (a <= 0.01) continue;

      const mg = g.createRadialGradient(mx, my, 0, mx, my, m.r * 2.5);
      mg.addColorStop(0, `rgba(255, 224, 168, ${a})`);
      mg.addColorStop(0.45, `rgba(255, 188, 112, ${a * 0.35})`);
      mg.addColorStop(1, 'rgba(255, 188, 112, 0)');
      g.fillStyle = mg;
      g.beginPath();
      g.arc(mx, my, m.r * 2.5, 0, Math.PI * 2);
      g.fill();
    }

    g.restore();
  }

  // =========================================================================
  // 10. Main Frame Update & Composite Render
  // =========================================================================
  function stepSimulation(dt) {
    elapsed += dt;

    const damp = Math.min(1, dt * 4.5);
    if (ptr.active) {
      const targetNx = clamp((ptr.rawX - L.cx) / (W * 0.5), -1, 1);
      const targetNy = clamp((ptr.rawY - L.cy) / (H * 0.5), -1, 1);
      ptr.nx = lerp(ptr.nx, targetNx, damp);
      ptr.ny = lerp(ptr.ny, targetNy, damp);
    } else {
      ptr.nx = lerp(ptr.nx, 0, Math.min(1, dt * 1.5));
      ptr.ny = lerp(ptr.ny, 0, Math.min(1, dt * 1.5));
    }

    ptr.warmthBoost = lerp(ptr.warmthBoost, ptr.overBroth ? 1 : 0, Math.min(1, dt * 3.0));

    for (let i = wakes.length - 1; i >= 0; i--) {
      wakes[i].age += dt;
      wakes[i].strength *= Math.pow(0.08, dt);
      if (wakes[i].age > 1.2 || wakes[i].strength < 0.015) {
        wakes.splice(i, 1);
      }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.age += dt;
      if (rp.age >= rp.maxAge) {
        ripples.splice(i, 1);
        continue;
      }
      const t = rp.age / rp.maxAge;
      const waveR = rp.maxR * (1 - Math.pow(1 - t, 2.4));
      const band = L.R * 0.08;
      const pushStr = (1 - t) * rp.strength * 0.014 * dt * 60;

      for (let j = 0; j < rayuDroplets.length; j++) {
        const d = rayuDroplets[j];
        const pos = brothToLocal(d.bx + d.dx, d.by + d.dy);
        const dx = pos.x - rp.x;
        const dy = (pos.y - rp.y) / L.ryRatio;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dist - waveR) < band && dist > 1) {
          d.dx += (dx / dist) * pushStr * 0.28;
          d.dy += (dy / dist) * pushStr * 0.28;
        }
      }
      for (let j = 0; j < scallions.length; j++) {
        const s = scallions[j];
        if (!s.floating) continue;
        const pos = brothToLocal(s.bx + s.dx, s.by + s.dy);
        const dx = pos.x - rp.x;
        const dy = (pos.y - rp.y) / L.ryRatio;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dist - waveR) < band && dist > 1) {
          s.dx += (dx / dist) * pushStr * 0.18;
          s.dy += (dy / dist) * pushStr * 0.18;
        }
      }
    }

    const ret = Math.pow(0.28, dt);
    for (let j = 0; j < rayuDroplets.length; j++) {
      rayuDroplets[j].dx *= ret;
      rayuDroplets[j].dy *= ret;
    }
    for (let j = 0; j < scallions.length; j++) {
      scallions[j].dx *= ret;
      scallions[j].dy *= ret;
    }
    for (let j = 0; j < sesameSeeds.length; j++) {
      sesameSeeds[j].dx *= ret;
      sesameSeeds[j].dy *= ret;
    }

    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.nx += (m.vx + Math.sin(elapsed * 0.5 + m.phase) * 0.008) * dt;
      m.ny += m.vy * dt;
      if (m.ny < -2.4) {
        m.ny = -0.15;
        m.nx = (liveSteamRng() - 0.5) * 1.25;
      }
    }

    stepSteam(dt, elapsed, false);
  }

  function renderFrame(timeSec) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const R = L.R;
    const px = reducedMotion ? 0 : ptr.nx;
    const py = reducedMotion ? 0 : ptr.ny;

    const lampSway = reducedMotion ? 0 : Math.sin(timeSec * 0.42) * 0.12;
    const lightOffX = px * 0.85 + lampSway;
    const lightOffY = py * 0.65;

    // 1. Dark Atmospheric Room & Charred Wood Counter
    ctx.drawImage(
      cache.backdrop.canvas,
      -cache.backdrop.pad - px * 9,
      -cache.backdrop.pad - py * 5,
      W + cache.backdrop.pad * 2,
      H + cache.backdrop.pad * 2
    );

    // 2. Bowl Root Transform
    const bowlX = L.cx + px * 5;
    const bowlY = L.cy + py * 3;

    ctx.save();
    ctx.translate(bowlX, bowlY);

    // 2a. Ceramic Bowl Exterior & Recessed Inner Cavity
    ctx.drawImage(
      cache.bowlBack.canvas,
      -cache.bowlBack.ox,
      -cache.bowlBack.oy,
      cache.bowlBack.canvas.width / dpr,
      cache.bowlBack.canvas.height / dpr
    );

    // 3. Broth Surface, Submerged Noodles, Ripples, Oil Droplets & Specular Sheen
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, L.innerOffY, L.innerRx, L.innerRy, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.beginPath();
    ctx.ellipse(0, L.brothOffY, L.brothRx, L.brothRy, 0, 0, Math.PI * 2);
    ctx.clip();

    const driftX = reducedMotion ? 0 : Math.sin(timeSec * 0.32) * 2.2;
    const driftY = reducedMotion ? 0 : Math.cos(timeSec * 0.28) * 1.4;
    ctx.drawImage(
      cache.brothBase.canvas,
      -cache.brothBase.ox + driftX,
      L.brothOffY - cache.brothBase.oy + driftY,
      cache.brothBase.canvas.width / dpr,
      cache.brothBase.canvas.height / dpr
    );

    const pulse = reducedMotion ? 0.5 : (0.5 + 0.5 * Math.sin(timeSec * 0.95));
    const hotGlow = ctx.createRadialGradient(
      -R * 0.10 + lightOffX * R * 0.14,
      L.brothOffY - R * 0.04 + lightOffY * R * 0.08,
      R * 0.04,
      0,
      L.brothOffY,
      L.brothRx * 0.86
    );
    hotGlow.addColorStop(0, `rgba(255, 224, 138, ${0.15 + pulse * 0.05 + ptr.warmthBoost * 0.09})`);
    hotGlow.addColorStop(0.55, `rgba(238, 152, 52, ${0.045 + ptr.warmthBoost * 0.03})`);
    hotGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = hotGlow;
    ctx.fillRect(-R, -R, R * 2, R * 2);

    drawNoodles(ctx, timeSec, 'submerged');

    if (ripples.length > 0) {
      drawRipples(ctx);
    }

    drawOilDroplets(ctx, timeSec, lightOffX, lightOffY);

    // Glossy overhead pendant reflection gliding smoothly on the hot liquid surface
    const specX = -R * 0.24 + lightOffX * R * 0.18;
    const specY = L.brothOffY - R * 0.14 + lightOffY * R * 0.10;
    ctx.save();
    ctx.translate(specX, specY);
    ctx.rotate(-0.22);
    const specGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, R * 0.44);
    specGrad.addColorStop(0, 'rgba(255, 250, 228, 0.22)');
    specGrad.addColorStop(0.45, 'rgba(255, 228, 170, 0.07)');
    specGrad.addColorStop(1, 'rgba(255, 220, 155, 0)');
    ctx.fillStyle = specGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 0.44, R * 0.19, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore(); // end broth clip

    // 4. Artisanal Vegan Toppings (Front tucked cleanly behind lip; back rises naturally)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, L.innerOffY, L.innerRx, L.innerRy, 0, 0.04 * Math.PI, 0.96 * Math.PI, false);
    ctx.lineTo(-R * 1.45, L.innerOffY);
    ctx.lineTo(-R * 1.45, -R * 1.65);
    ctx.lineTo(R * 1.45, -R * 1.65);
    ctx.lineTo(R * 1.45, L.innerOffY);
    ctx.closePath();
    ctx.clip();

    const topPx = px * 2.8;
    const topPy = py * 1.8;

    // 4a. Back-Right Roasted Nori Sheets
    const noriFlex1 = reducedMotion ? 0 : Math.sin(timeSec * 0.95) * 0.012;
    const noriFlex2 = reducedMotion ? 0 : Math.sin(timeSec * 0.82 + 1.4) * 0.015;

    ctx.save();
    const n1Pos = brothToLocal(0.44, -0.50);
    ctx.translate(n1Pos.x + topPx * 0.7, n1Pos.y + topPy * 0.7);
    ctx.rotate(0.24 + noriFlex1);
    ctx.drawImage(
      cache.noriBack.canvas,
      -cache.noriBack.ox,
      -cache.noriBack.oy,
      cache.noriBack.canvas.width / dpr,
      cache.noriBack.canvas.height / dpr
    );
    ctx.restore();

    ctx.save();
    const n2Pos = brothToLocal(0.62, -0.34);
    ctx.translate(n2Pos.x + topPx * 0.9, n2Pos.y + topPy * 0.8);
    ctx.rotate(0.42 + noriFlex2);
    ctx.drawImage(
      cache.noriFront.canvas,
      -cache.noriFront.ox,
      -cache.noriFront.oy,
      cache.noriFront.canvas.width / dpr,
      cache.noriFront.canvas.height / dpr
    );
    ctx.restore();

    // 4b. Pan-Seared Lotus Root (Renkon) Slices
    const bobLotus = reducedMotion ? 0 : Math.sin(timeSec * 0.9 + 0.5) * 0.8;
    ctx.save();
    const l2Pos = brothToLocal(0.08, -0.50);
    ctx.translate(l2Pos.x + topPx * 0.4, l2Pos.y + bobLotus * 0.8);
    ctx.rotate(0.18);
    ctx.drawImage(
      cache.lotusB.canvas,
      -cache.lotusB.ox,
      -cache.lotusB.oy,
      cache.lotusB.canvas.width / dpr,
      cache.lotusB.canvas.height / dpr
    );
    ctx.restore();

    ctx.save();
    const l1Pos = brothToLocal(-0.08, -0.44);
    ctx.translate(l1Pos.x + topPx * 0.5, l1Pos.y + bobLotus);
    ctx.rotate(-0.14);
    ctx.drawImage(
      cache.lotusA.canvas,
      -cache.lotusA.ox,
      -cache.lotusA.oy,
      cache.lotusA.canvas.width / dpr,
      cache.lotusA.canvas.height / dpr
    );
    ctx.restore();

    // 4c. Plump Scored Shiitake Mushroom Caps
    const bobShiiA = reducedMotion ? 0 : Math.sin(timeSec * 0.85 + 2.1) * 0.9;
    const bobShiiB = reducedMotion ? 0 : Math.sin(timeSec * 0.92 + 3.4) * 0.8;

    ctx.save();
    const s2Pos = brothToLocal(-0.34, -0.44);
    ctx.translate(s2Pos.x + topPx * 0.5, s2Pos.y + bobShiiB);
    ctx.rotate(-0.22);
    ctx.drawImage(
      cache.shiitakeB.canvas,
      -cache.shiitakeB.ox,
      -cache.shiitakeB.oy,
      cache.shiitakeB.canvas.width / dpr,
      cache.shiitakeB.canvas.height / dpr
    );
    ctx.restore();

    ctx.save();
    const s1Pos = brothToLocal(-0.56, -0.22);
    ctx.translate(s1Pos.x + topPx * 0.65, s1Pos.y + bobShiiA);
    ctx.rotate(0.14);
    ctx.drawImage(
      cache.shiitakeA.canvas,
      -cache.shiitakeA.ox,
      -cache.shiitakeA.oy,
      cache.shiitakeA.canvas.width / dpr,
      cache.shiitakeA.canvas.height / dpr
    );
    ctx.restore();

    // 4d. Charred Baby Bok Choy
    const bokFlex = reducedMotion ? 0 : Math.sin(timeSec * 0.76 + 0.9) * 0.012;
    ctx.save();
    const bkPos = brothToLocal(0.32, -0.02);
    ctx.translate(bkPos.x + topPx * 0.85, bkPos.y + topPy * 0.6);
    ctx.rotate(-0.12 + bokFlex);
    ctx.drawImage(
      cache.bokChoy.canvas,
      -cache.bokChoy.ox,
      -cache.bokChoy.oy,
      cache.bokChoy.canvas.width / dpr,
      cache.bokChoy.canvas.height / dpr
    );
    ctx.restore();

    // 4e. Emergent Folded Wavy Ramen Noodles
    drawNoodles(ctx, timeSec, 'emergent');

    // 4f. Two Thick Overlapping Perspective-True Seared Tofu Slabs
    const bobTofu = reducedMotion ? 0 : Math.sin(timeSec * 0.80 + 4.2) * 0.7;

    ctx.save();
    const t2Pos = brothToLocal(-0.56, 0.16);
    ctx.translate(t2Pos.x + topPx * 0.7, t2Pos.y + bobTofu * 0.9);
    ctx.rotate(-0.30);
    ctx.drawImage(
      cache.tofuB.canvas,
      -cache.tofuB.ox,
      -cache.tofuB.oy,
      cache.tofuB.canvas.width / dpr,
      cache.tofuB.canvas.height / dpr
    );
    ctx.restore();

    ctx.save();
    const t1Pos = brothToLocal(-0.42, 0.36);
    ctx.translate(t1Pos.x + topPx * 0.85, t1Pos.y + bobTofu);
    ctx.rotate(-0.14);
    ctx.drawImage(
      cache.tofuA.canvas,
      -cache.tofuA.ox,
      -cache.tofuA.oy,
      cache.tofuA.canvas.width / dpr,
      cache.tofuA.canvas.height / dpr
    );
    ctx.restore();

    // 4g. Roasted Sweet Corn Kernels
    drawCorn(ctx, timeSec);

    // 4h. Thinly-Sliced Fresh Scallion Rings
    drawScallions(ctx, timeSec);

    // 4i. Toasted White & Black Sesame Seeds
    drawSesame(ctx, timeSec);

    // 4j. Delicate Crimson Chili Threads
    ctx.save();
    ctx.translate(topPx * 1.1, topPy * 0.9);
    drawChiliThreads(ctx, timeSec);
    ctx.restore();

    ctx.restore(); // end toppings clip

    // 5. Front Ceramic Rim Lip & Live Specular Rim Glaze Highlight
    ctx.drawImage(
      cache.bowlFrontLip.canvas,
      -cache.bowlFrontLip.ox,
      -cache.bowlFrontLip.oy,
      cache.bowlFrontLip.canvas.width / dpr,
      cache.bowlFrontLip.canvas.height / dpr
    );

    const rimHighlightAng = Math.PI * (0.58 - clamp(lightOffX, -1, 1) * 0.22);
    ctx.strokeStyle = 'rgba(255, 230, 186, 0.48)';
    ctx.lineWidth = Math.max(1.4, R * 0.009);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(
      0,
      L.innerOffY * 0.35,
      (R + L.innerRx) * 0.5,
      (L.rimRy + L.innerRy) * 0.5,
      0,
      rimHighlightAng - 0.28,
      rimHighlightAng + 0.28
    );
    ctx.stroke();

    ctx.restore(); // end bowl root transform

    // 6. Seamless Volumetric Curling Steam Rising from the Hot Bowl
    renderSteamLayer(bowlX, bowlY, lightOffX);

    // 7. Seamless Overhead Warm Ambient Glow & Floating Bokeh Motes
    drawOverheadLightAndMotes(ctx, timeSec, lightOffX);

    // 8. Intimate Late-Night Izakaya Cinematic Vignette
    const vigR = Math.hypot(W * 0.5, H * 0.5);
    const vig = ctx.createRadialGradient(L.cx, L.cy - R * 0.16, R * 0.72, L.cx, L.cy - R * 0.06, vigR * 1.08);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(0.56, 'rgba(3, 2, 1, 0.16)');
    vig.addColorStop(0.84, 'rgba(2, 1, 1, 0.54)');
    vig.addColorStop(1, 'rgba(1, 1, 1, 0.85)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  // =========================================================================
  // 11. Interactive Pointer Handling
  // =========================================================================
  function isInsideBroth(clientX, clientY) {
    const lx = clientX - L.cx;
    const ly = clientY - (L.cy + L.brothOffY);
    const nx = lx / L.brothRx;
    const ny = ly / L.brothRy;
    return nx * nx + ny * ny <= 0.94;
  }

  function addRipple(clientX, clientY, strength, maxScale) {
    if (reducedMotion) return;
    ripples.push({
      x: clientX - L.cx,
      y: clientY - L.cy,
      age: 0,
      maxAge: 1.55 + Math.random() * 0.45,
      maxR: L.brothRx * (maxScale || 0.42),
      strength: strength || 0.8
    });
    if (ripples.length > 14) ripples.shift();
  }

  function handlePointerMove(e) {
    const x = e.clientX;
    const y = e.clientY;
    const prevX = ptr.active ? ptr.rawX : x;
    const prevY = ptr.active ? ptr.rawY : y;
    const dx = x - prevX;
    const dy = y - prevY;
    const speed = Math.hypot(dx, dy);

    ptr.rawX = x;
    ptr.rawY = y;
    ptr.active = true;
    ptr.overBroth = isInsideBroth(x, y);

    if (reducedMotion) return;

    if (speed > 1.2) {
      wakes.push({
        x: x - L.cx,
        y: y - L.cy,
        vx: clamp(dx * 5.6, -210, 210),
        vy: clamp(dy * 5.6, -210, 210),
        r: L.R * 0.48,
        strength: clamp(speed / 15, 0.25, 1.5),
        age: 0
      });
      if (wakes.length > 18) wakes.shift();
    }

    const now = performance.now();
    if (ptr.overBroth && speed > 2.4 && now - ptr.lastRippleT > 110) {
      if (Math.hypot(x - ptr.lastRippleX, y - ptr.lastRippleY) > 15) {
        addRipple(x, y, clamp(speed / 26, 0.30, 0.68), 0.28);
        ptr.lastRippleX = x;
        ptr.lastRippleY = y;
        ptr.lastRippleT = now;
      }
    }
  }

  function handlePointerDown(e) {
    ptr.rawX = e.clientX;
    ptr.rawY = e.clientY;
    ptr.active = true;
    ptr.overBroth = isInsideBroth(e.clientX, e.clientY);

    if (reducedMotion) return;

    if (ptr.overBroth) {
      addRipple(e.clientX, e.clientY, 1.0, 0.56);
      wakes.push({
        x: e.clientX - L.cx,
        y: e.clientY - L.cy - L.R * 0.14,
        vx: (Math.random() - 0.5) * 26,
        vy: -120,
        r: L.R * 0.58,
        strength: 1.15,
        age: 0
      });
    } else {
      wakes.push({
        x: e.clientX - L.cx,
        y: e.clientY - L.cy,
        vx: (Math.random() - 0.5) * 48,
        vy: -98,
        r: L.R * 0.54,
        strength: 0.92,
        age: 0
      });
    }
  }

  function handlePointerLeave() {
    ptr.active = false;
    ptr.overBroth = false;
  }

  canvas.addEventListener('pointermove', handlePointerMove, { passive: true });
  canvas.addEventListener('pointerdown', handlePointerDown, { passive: true });
  window.addEventListener('pointerleave', handlePointerLeave, { passive: true });
  window.addEventListener('blur', handlePointerLeave);

  // =========================================================================
  // 12. Animation Loop & Lifecycle
  // =========================================================================
  function loop(now) {
    if (reducedMotion) {
      rafId = null;
      return;
    }
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    stepSimulation(dt);
    renderFrame(elapsed);

    rafId = requestAnimationFrame(loop);
  }

  function startLoop() {
    if (reducedMotion) {
      renderFrame(0);
      return;
    }
    if (rafId === null) {
      lastTime = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  function stopLoop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  reducedMotionMQ.addEventListener('change', (ev) => {
    reducedMotion = ev.matches;
    if (reducedMotion) {
      stopLoop();
      ptr.nx = 0;
      ptr.ny = 0;
      ptr.warmthBoost = 0;
      wakes.length = 0;
      ripples.length = 0;
      renderFrame(0);
    } else {
      startLoop();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopLoop();
    } else if (!reducedMotion) {
      startLoop();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateLayout, 60);
  });

  updateLayout();
  startLoop();
})();
</script>
</body>
