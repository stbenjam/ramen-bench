<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steaming Vegan Ramen</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070504;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Respect prefers-reduced-motion dynamically
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let prefersReducedMotion = reducedMotionQuery.matches;
      reducedMotionQuery.addEventListener('change', (e) => {
        prefersReducedMotion = e.matches;
      });

      // Viewport & Coordinate State
      let width = 0;
      let height = 0;
      let dpr = 1;
      let scaleFactor = 1;
      let centerX = 0;
      let centerY = 0;

      // Bowl logical constants (local unit space: rim outer radius R = 224)
      const R = 224;
      const ASPECT = 0.59; // Natural 3/4 culinary hero camera angle
      const BROTH_R = 200;
      const BROTH_Y = 14;  // Broth meniscus depth recessed below ceramic lip

      // Pointer & Interaction State
      const pointer = {
        x: 0,
        y: 0,
        nx: 0,
        ny: 0,
        smoothNx: 0,
        smoothNy: 0,
        vx: 0,
        vy: 0,
        localX: 0,
        localY: 0,
        inBroth: false,
        active: false,
        down: false
      };

      // Procedural Pre-computed Geometry & Particles
      const woodGrains = [];
      const potteryRings = [];
      const glazeSpecks = [];
      const deepNoodles = [];
      const crownNoodles = [];
      const oilDroplets = [];
      const sesameSeeds = [];
      const scallions = [];
      const cornKernels = [];
      const chiliThreads = [];
      const ripples = [];
      const steamPlumes = [];
      const steamWisps = [];
      const ambientMotes = [];

      // Deterministic PRNG for art-directed composition
      let seed = 739182;
      function rand() {
        seed ^= seed << 13;
        seed ^= seed >>> 17;
        seed ^= seed << 5;
        return ((seed >>> 0) / 4294967296);
      }
      function randRange(min, max) {
        return min + rand() * (max - min);
      }

      function initSceneData() {
        seed = 904217;

        // 1. Dark Charred Shou Sugi Ban / Walnut Wood Table Grains
        woodGrains.length = 0;
        for (let i = 0; i < 44; i++) {
          const yBase = -110 + (i / 43) * 530 + randRange(-6, 6);
          const ctrlOffset1 = randRange(-24, 24);
          const ctrlOffset2 = randRange(-24, 24);
          const alpha = randRange(0.03, 0.09);
          const thickness = randRange(1.2, 4.2);
          const warmShift = rand() > 0.48 ? 'rgba(54, 33, 19,' : 'rgba(17, 10, 6,';
          woodGrains.push({ yBase, ctrlOffset1, ctrlOffset2, alpha, thickness, warmShift });
        }

        // 2. Ceramic Bowl Exterior Throwing Rings & Iron-Glaze Speckles
        potteryRings.length = 0;
        for (let i = 0; i < 20; i++) {
          potteryRings.push({
            t: 0.08 + (i / 20) * 0.85,
            alpha: randRange(0.04, 0.15),
            width: randRange(0.9, 2.4)
          });
        }

        glazeSpecks.length = 0;
        for (let i = 0; i < 85; i++) {
          glazeSpecks.push({
            x: randRange(-R + 12, R - 12),
            y: randRange(12, 175),
            r: randRange(0.6, 1.9),
            warm: rand() > 0.4,
            alpha: randRange(0.08, 0.28)
          });
        }

        // 3A. Deep Broth-Submerged Alkaline Ramen Noodles
        deepNoodles.length = 0;
        for (let i = 0; i < 28; i++) {
          const startAngle = randRange(0, Math.PI * 2);
          const startDist = randRange(20, 148);
          const sx = Math.cos(startAngle) * startDist;
          const sy = Math.sin(startAngle) * startDist * 0.72 + 12;
          const dir = startAngle + randRange(1.3, 3.6);
          const length = randRange(115, 195);
          const waveFreq = randRange(0.07, 0.11);
          const waveAmp = randRange(6.5, 12.5);
          const phase = randRange(0, Math.PI * 2);
          const depth = (i / 27) * 0.65;
          const curveBend = randRange(-0.4, 0.4);
          deepNoodles.push({ sx, sy, dir, length, waveFreq, waveAmp, phase, depth, curveBend });
        }

        // 3B. Hero Folded Noodle Mound (Emerging glossy golden-wheat strands in the center)
        crownNoodles.length = 0;
        for (let i = 0; i < 22; i++) {
          const t = i / 21;
          const sx = -58 + randRange(-18, 16);
          const sy = -8 + (t - 0.5) * 48 + randRange(-6, 6);
          const dir = randRange(-0.22, 0.28);
          const length = randRange(105, 145);
          const waveFreq = randRange(0.085, 0.125);
          const waveAmp = randRange(5.5, 9.8);
          const phase = randRange(0, Math.PI * 2);
          const depth = 0.7 + t * 0.3;
          const curveBend = randRange(-0.22, 0.28);
          crownNoodles.push({ sx, sy, dir, length, waveFreq, waveAmp, phase, depth, curveBend });
        }

        // 4. Ruby Chili Oil (Rayu) & Toasted Sesame Oil Pearls on Broth
        oilDroplets.length = 0;
        for (let i = 0; i < 105; i++) {
          const angle = randRange(0, Math.PI * 2);
          const distBias = 0.25 + 0.75 * Math.pow(rand(), 0.58);
          const dist = distBias * (BROTH_R - 12);
          const x = Math.cos(angle) * dist;
          const y = Math.sin(angle) * dist * ASPECT;
          const r = rand() < 0.18 ? randRange(5.5, 12.0) : randRange(1.3, 4.8);
          const isChili = rand() < 0.74;
          oilDroplets.push({
            baseX: x,
            baseY: y,
            x,
            y,
            vx: 0,
            vy: 0,
            r,
            stretch: randRange(0.88, 1.18),
            rot: randRange(0, Math.PI),
            isChili,
            driftPhase: randRange(0, Math.PI * 2),
            driftSpeed: randRange(0.35, 0.95)
          });
        }

        // 5. Flame-Blistered Sweet Corn Kernels (Lower-Left)
        cornKernels.length = 0;
        const cornCenterX = -86;
        const cornCenterY = 38;
        for (let i = 0; i < 32; i++) {
          const a = randRange(0, Math.PI * 2);
          const d = Math.pow(rand(), 0.62) * 42;
          const kx = cornCenterX + Math.cos(a) * d;
          const ky = cornCenterY + Math.sin(a) * d * 0.68;
          const rot = randRange(0, Math.PI * 2);
          const charred = rand() < 0.28;
          const size = randRange(5.6, 7.6);
          cornKernels.push({ x: kx, y: ky, rot, charred, size, phase: randRange(0, 6.28) });
        }

        // 6. Freshly Sliced Green Scallions (Negi rings crowning center noodle fold & broth)
        scallions.length = 0;
        for (let i = 0; i < 28; i++) {
          const cluster = i < 20;
          const cx = cluster ? 8 + randRange(-32, 34) : randRange(-115, 115);
          const cy = cluster ? 2 + randRange(-20, 22) : randRange(-50, 65);
          const rOuter = randRange(5.2, 9.4);
          const rInner = rOuter * randRange(0.46, 0.66);
          const rot = randRange(0, Math.PI);
          const tilt = randRange(0.55, 0.8);
          const hueShift = randRange(-8, 12);
          scallions.push({
            baseX: cx,
            baseY: cy,
            x: cx,
            y: cy,
            vx: 0,
            vy: 0,
            rOuter,
            rInner,
            rot,
            tilt,
            hueShift,
            phase: randRange(0, Math.PI * 2)
          });
        }

        // 7. Toasted White & Black Sesame Seeds
        sesameSeeds.length = 0;
        for (let i = 0; i < 72; i++) {
          const a = randRange(0, Math.PI * 2);
          const d = Math.pow(rand(), 0.68) * (BROTH_R - 20);
          const sx = Math.cos(a) * d;
          const sy = Math.sin(a) * d * ASPECT;
          const isBlack = rand() < 0.3;
          sesameSeeds.push({
            x: sx,
            y: sy,
            rot: randRange(0, Math.PI * 2),
            isBlack,
            phase: randRange(0, Math.PI * 2)
          });
        }

        // 8. Delicate Ito Togarashi (Crimson Chili Threads crowning the scallions)
        chiliThreads.length = 0;
        for (let i = 0; i < 18; i++) {
          const sx = 6 + randRange(-22, 22);
          const sy = -2 + randRange(-14, 14);
          const c1x = sx + randRange(-26, 26);
          const c1y = sy + randRange(-24, 10);
          const c2x = c1x + randRange(-22, 22);
          const c2y = c1y + randRange(-18, 16);
          const ex = c2x + randRange(-16, 16);
          const ey = c2y + randRange(-14, 14);
          chiliThreads.push({ sx, sy, c1x, c1y, c2x, c2y, ex, ey });
        }

        // 9. Volumetric Soft Steam Plume Clouds
        steamPlumes.length = 0;
        const steamCount = 44;
        for (let i = 0; i < steamCount; i++) {
          steamPlumes.push(createSteamParticle(i / steamCount));
        }

        // 10. Sculpted Curling Steam Wisps (Silky S-curve vapor tendrils)
        steamWisps.length = 0;
        for (let i = 0; i < 9; i++) {
          steamWisps.push(createSteamWisp(i / 9));
        }

        // 11. Warm Floating Atmospheric Heat Motes
        ambientMotes.length = 0;
        for (let i = 0; i < 36; i++) {
          ambientMotes.push({
            x: randRange(-420, 420),
            y: randRange(-380, 230),
            r: randRange(0.8, 2.3),
            alpha: randRange(0.08, 0.34),
            speedY: randRange(6, 17),
            phase: randRange(0, Math.PI * 2),
            sway: randRange(12, 34)
          });
        }
      }

      function createSteamParticle(initialProgress) {
        const spawnAngle = randRange(0, Math.PI * 2);
        const spawnDist = Math.pow(rand(), 0.65) * (BROTH_R * 0.76);
        const originX = Math.cos(spawnAngle) * spawnDist;
        const originY = Math.sin(spawnAngle) * spawnDist * ASPECT - 4;
        return {
          originX,
          originY,
          x: originX,
          y: originY - initialProgress * 320,
          vx: 0,
          life: initialProgress,
          speed: randRange(0.13, 0.24),
          baseRadius: randRange(24, 48),
          maxRadius: randRange(88, 162),
          swayFreq: randRange(1.1, 2.4),
          swayAmp: randRange(15, 36),
          phase: randRange(0, Math.PI * 2),
          opacity: randRange(0.05, 0.115)
        };
      }

      function createSteamWisp(initialProgress) {
        const originX = randRange(-125, 115);
        const originY = randRange(-38, 35);
        return {
          originX,
          originY,
          vx: 0,
          life: initialProgress,
          speed: randRange(0.15, 0.25),
          height: randRange(175, 295),
          curlAmp: randRange(18, 42),
          curlDir: rand() > 0.5 ? 1 : -1,
          thickness: randRange(14, 28),
          phase: randRange(0, Math.PI * 2),
          opacity: randRange(0.045, 0.095)
        };
      }

      function spawnRipple(lx, ly, strength) {
        if (prefersReducedMotion) return;
        if (ripples.length > 14) ripples.shift();
        ripples.push({
          x: lx,
          y: ly,
          r: 4,
          maxR: randRange(48, 96) * Math.min(1.4, Math.max(0.7, strength)),
          alpha: Math.min(0.42, 0.18 + strength * 0.16)
        });
      }

      // Responsive Framing across all aspect ratios (Ultrawide, Desktop, Tablet, Portrait Mobile)
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);

        // Total horizontal visual span of bowl + chopsticks tip (~ -250 to +300 -> 560 units)
        // Total vertical visual span of steam top to bowl coaster (~ -330 to +240 -> 570 units)
        const scaleX = (width * 0.90) / 550;
        const scaleY = (height * 0.86) / 575;
        scaleFactor = Math.min(scaleX, scaleY);
        scaleFactor = Math.max(0.45, Math.min(scaleFactor, 1.72));

        // Slight slight left offset (-12 units) balances the chopsticks extending on the right
        centerX = width * 0.5 - 10 * scaleFactor;
        centerY = height * 0.56;
      }

      // Pointer & Touch Tracking
      function updatePointer(clientX, clientY) {
        const prevX = pointer.x;
        const prevY = pointer.y;
        pointer.x = clientX;
        pointer.y = clientY;
        pointer.nx = (clientX / Math.max(1, width)) * 2 - 1;
        pointer.ny = (clientY / Math.max(1, height)) * 2 - 1;
        pointer.vx = clientX - prevX;
        pointer.vy = clientY - prevY;
        pointer.active = true;

        const tiltX = pointer.smoothNx * 14;
        const tiltY = pointer.smoothNy * 9;
        const lx = (clientX - (centerX + tiltX * scaleFactor)) / scaleFactor;
        const ly = (clientY - (centerY + tiltY * scaleFactor)) / scaleFactor;
        pointer.localX = lx;
        pointer.localY = ly;

        const brothY = ly - BROTH_Y;
        const normDist = (lx * lx) / (BROTH_R * BROTH_R) + (brothY * brothY) / ((BROTH_R * ASPECT) * (BROTH_R * ASPECT));
        pointer.inBroth = normDist < 0.96;

        const speed = Math.hypot(pointer.vx, pointer.vy);
        if (pointer.inBroth && speed > 3.2 && !prefersReducedMotion) {
          if (Math.random() < 0.42) {
            spawnRipple(lx, ly, Math.min(1.5, speed / 18));
          }
        }
      }

      window.addEventListener('pointermove', (e) => {
        updatePointer(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        pointer.down = true;
        updatePointer(e.clientX, e.clientY);
        if (pointer.inBroth && !prefersReducedMotion) {
          spawnRipple(pointer.localX, pointer.localY, 1.4);
          for (let i = 0; i < oilDroplets.length; i++) {
            const d = oilDroplets[i];
            const dx = d.x - pointer.localX;
            const dy = (d.y + BROTH_Y) - pointer.localY;
            const dist = Math.hypot(dx, dy) + 1;
            if (dist < 95) {
              const force = (1 - dist / 95) * 4.0;
              d.vx += (dx / dist) * force - (dy / dist) * force * 0.55;
              d.vy += (dy / dist) * force + (dx / dist) * force * 0.4;
            }
          }
        }
      }, { passive: true });

      window.addEventListener('pointerup', () => {
        pointer.down = false;
      }, { passive: true });

      window.addEventListener('pointerleave', () => {
        pointer.active = false;
        pointer.inBroth = false;
      }, { passive: true });

      window.addEventListener('resize', resize);

      // ============================================================================
      // SCENE ENVIRONMENT, LIGHTING & CHOPSTICKS
      // ============================================================================

      function drawBackgroundAndTable(time) {
        ctx.fillStyle = '#070504';
        ctx.fillRect(0, 0, width, height);

        // Warm Overhead Pendant Spotlight Pool (tracks mouse gently for ambient warmth)
        const lightX = centerX + pointer.smoothNx * width * 0.085;
        const lightY = centerY - 55 * scaleFactor + pointer.smoothNy * height * 0.055;
        const maxRad = Math.max(width, height) * 0.8;

        const bgGlow = ctx.createRadialGradient(lightX, lightY, 12 * scaleFactor, lightX, lightY, maxRad);
        bgGlow.addColorStop(0.0, 'rgba(78, 41, 18, 0.48)');
        bgGlow.addColorStop(0.28, 'rgba(45, 22, 10, 0.29)');
        bgGlow.addColorStop(0.62, 'rgba(19, 10, 6, 0.14)');
        bgGlow.addColorStop(1.0, 'rgba(5, 3, 3, 0)');
        ctx.fillStyle = bgGlow;
        ctx.fillRect(0, 0, width, height);

        // Warm Rim-Light Halo illuminating rising steam behind the bowl
        const steamHaloY = centerY - 140 * scaleFactor;
        const breath = prefersReducedMotion ? 1 : 0.94 + Math.sin(time * 1.05) * 0.06;
        const steamHalo = ctx.createRadialGradient(
          lightX, steamHaloY, 15 * scaleFactor,
          lightX, steamHaloY, 305 * scaleFactor
        );
        steamHalo.addColorStop(0.0, `rgba(224, 136, 64, ${0.15 * breath})`);
        steamHalo.addColorStop(0.45, `rgba(136, 68, 26, ${0.07 * breath})`);
        steamHalo.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = steamHalo;
        ctx.fillRect(0, 0, width, height);

        // Dark Charred Walnut Countertop in Perspective
        ctx.save();
        ctx.translate(centerX - pointer.smoothNx * 7 * scaleFactor, centerY - pointer.smoothNy * 4 * scaleFactor);
        ctx.scale(scaleFactor, scaleFactor);

        const tableHorizonY = -105;
        const tableGrad = ctx.createLinearGradient(0, tableHorizonY, 0, 440);
        tableGrad.addColorStop(0, 'rgba(10, 7, 5, 0)');
        tableGrad.addColorStop(0.16, 'rgba(24, 15, 10, 0.56)');
        tableGrad.addColorStop(0.55, 'rgba(32, 19, 12, 0.76)');
        tableGrad.addColorStop(1, 'rgba(12, 7, 5, 0.94)');
        ctx.fillStyle = tableGrad;
        ctx.fillRect(-1300, tableHorizonY, 2600, 700);

        for (let i = 0; i < woodGrains.length; i++) {
          const g = woodGrains[i];
          if (g.yBase < tableHorizonY + 8) continue;
          ctx.beginPath();
          ctx.moveTo(-1150, g.yBase);
          ctx.bezierCurveTo(
            -380, g.yBase + g.ctrlOffset1,
            380, g.yBase + g.ctrlOffset2,
            1150, g.yBase + g.ctrlOffset1 * 0.5
          );
          ctx.strokeStyle = `${g.warmShift}${g.alpha})`;
          ctx.lineWidth = g.thickness;
          ctx.stroke();
        }

        // Warm bounced amber reflection on tabletop surrounding the deep donburi base
        const tableReflect = ctx.createRadialGradient(
          pointer.smoothNx * 20, 185, 30,
          pointer.smoothNx * 20, 192, 330
        );
        tableReflect.addColorStop(0, 'rgba(155, 78, 26, 0.24)');
        tableReflect.addColorStop(0.52, 'rgba(82, 38, 13, 0.10)');
        tableReflect.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = tableReflect;
        ctx.beginPath();
        ctx.ellipse(0, 192, 335, 132, 0, 0, Math.PI * 2);
        ctx.fill();

        // Woven Dark Bamboo / Slate Coaster Mat beneath the deep ceramic foot
        ctx.save();
        ctx.translate(0, 196);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
        ctx.beginPath();
        ctx.ellipse(4, 9, 186, 72, 0, 0, Math.PI * 2);
        ctx.fill();

        const matGrad = ctx.createLinearGradient(-180, -50, 180, 58);
        matGrad.addColorStop(0, '#211915');
        matGrad.addColorStop(0.5, '#16110e');
        matGrad.addColorStop(1, '#0d0907');
        ctx.fillStyle = matGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, 182, 69, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.clip();
        ctx.strokeStyle = 'rgba(255, 218, 178, 0.05)';
        ctx.lineWidth = 1.2;
        for (let sy = -68; sy <= 68; sy += 6.2) {
          ctx.beginPath();
          ctx.moveTo(-190, sy);
          ctx.lineTo(190, sy);
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(10, 7, 5, 0.78)';
        ctx.lineWidth = 3.2;
        [-98, 0, 98].forEach((sx) => {
          ctx.beginPath();
          ctx.moveTo(sx, -72);
          ctx.quadraticCurveTo(sx * 1.07, 0, sx, 72);
          ctx.stroke();
        });
        ctx.restore();

        ctx.restore();
      }

      function drawChopsticks(tiltX, tiltY) {
        // Ebony & Rosewood Artisan Chopsticks resting beside the bowl on a river-stone hashioki
        ctx.save();
        ctx.translate(centerX + tiltX * 0.82 * scaleFactor, centerY + tiltY * 0.82 * scaleFactor);
        ctx.scale(scaleFactor, scaleFactor);

        // River-stone ceramic hashioki (chopstick rest)
        ctx.save();
        ctx.translate(232, 134);
        ctx.rotate(0.24);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.68)';
        ctx.beginPath();
        ctx.ellipse(3, 6, 26, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        const restGrad = ctx.createRadialGradient(-6, -4, 2, 0, 0, 26);
        restGrad.addColorStop(0, '#52433a');
        restGrad.addColorStop(0.6, '#261e1a');
        restGrad.addColorStop(1, '#120e0c');
        ctx.fillStyle = restGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Tapered wooden chopsticks resting cleanly on the table/hashioki to the right
        const sticks = [
          { x1: 112, y1: -56, x2: 288, y2: 162, w1: 2.3, w2: 5.6 },
          { x1: 98, y1: -48, x2: 274, y2: 174, w1: 2.3, w2: 5.6 }
        ];

        sticks.forEach((s) => {
          const angle = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          const nx = -Math.sin(angle);
          const ny = Math.cos(angle);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
          ctx.beginPath();
          ctx.moveTo(s.x1 + nx * s.w1 + 4, s.y1 + ny * s.w1 + 9);
          ctx.lineTo(s.x2 + nx * s.w2 + 4, s.y2 + ny * s.w2 + 11);
          ctx.lineTo(s.x2 - nx * s.w2 + 4, s.y2 - ny * s.w2 + 11);
          ctx.lineTo(s.x1 - nx * s.w1 + 4, s.y1 - ny * s.w1 + 9);
          ctx.closePath();
          ctx.fill();

          const stickGrad = ctx.createLinearGradient(s.x1, s.y1, s.x2, s.y2);
          stickGrad.addColorStop(0, '#633820');
          stickGrad.addColorStop(0.55, '#3e2011');
          stickGrad.addColorStop(0.80, '#26130a');
          stickGrad.addColorStop(0.82, '#a8783c'); // Subtle brushed brass inlay ring
          stickGrad.addColorStop(0.84, '#1c0e08');
          stickGrad.addColorStop(1, '#140905');

          ctx.fillStyle = stickGrad;
          ctx.beginPath();
          ctx.moveTo(s.x1 + nx * s.w1, s.y1 + ny * s.w1);
          ctx.lineTo(s.x2 + nx * s.w2, s.y2 + ny * s.w2);
          ctx.lineTo(s.x2 - nx * s.w2, s.y2 - ny * s.w2);
          ctx.lineTo(s.x1 - nx * s.w1, s.y1 - ny * s.w1);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 208, 158, 0.24)';
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.moveTo(s.x1 - nx * (s.w1 * 0.65), s.y1 - ny * (s.w1 * 0.65));
          ctx.lineTo(s.x2 - nx * (s.w2 * 0.65), s.y2 - ny * (s.w2 * 0.65));
          ctx.stroke();
        });

        ctx.restore();

      function drawBrothAndContents(time, dt) {
        const brothRx = BROTH_R;

        ctx.save();
        ctx.translate(0, BROTH_Y);

        const swirlMotion = prefersReducedMotion ? 0 : time * 0.22;
        for (let s = 0; s < 5; s++) {
          const ang = s * 1.25 + swirlMotion * (s % 2 === 0 ? 1 : -0.7);
          const sx = Math.cos(ang) * 60;
          const sy = Math.sin(ang) * 35;
          const cloudGrad = ctx.createRadialGradient(sx, sy, 4, sx, sy, 90);
          cloudGrad.addColorStop(0, 'rgba(250, 206, 138, 0.22)');
          cloudGrad.addColorStop(0.6, 'rgba(225, 150, 70, 0.08)');
          cloudGrad.addColorStop(1, 'rgba(180, 95, 30, 0)');

      function drawNoodleSet(list, time) {
        const gentleWave = prefersReducedMotion ? 0 : time * 1.15;

        for (let i = 0; i < list.length; i++) {
          const n = list[i];
          const steps = 22;
          const stepLen = n.length / steps;

          const pts = [];
          let curDir = n.dir;
          let cx = n.sx;
          let cy = n.sy;

          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            curDir += n.curveBend * 0.05;
            const perpX = -Math.sin(curDir);
            const perpY = Math.cos(curDir) * 0.72;
            const wave = Math.sin(s * stepLen * n.waveFreq + n.phase + gentleWave * 0.45) * n.waveAmp * Math.sin(t * Math.PI);

            let pushX = 0;
            let pushY = 0;
            if (pointer.inBroth && !prefersReducedMotion) {
              const dx = cx - pointer.localX;
              const dy = (cy + BROTH_Y) - pointer.localY;
              const distSq = dx * dx + dy * dy;
              if (distSq < 4400) {
                const factor = (1 - distSq / 4400) * 3.8;
                const d = Math.sqrt(distSq) + 1;
                pushX = (dx / d) * factor;
                pushY = (dy / d) * factor * 0.65;
              }
            }

            pts.push({
              x: cx + perpX * wave + pushX,
              y: cy + perpY * wave + pushY
            });

            cx += Math.cos(curDir) * stepLen;
            cy += Math.sin(curDir) * stepLen * 0.66;
          }

          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          const alpha = 0.38 + n.depth * 0.62;
          ctx.strokeStyle = `rgba(105, 44, 10, ${alpha * 0.58})`;
          ctx.lineWidth = 6.8;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y + 2.2);
          for (let s = 1; s < pts.length; s++) {
            ctx.lineTo(pts[s].x, pts[s].y + 2.2);
          }
          ctx.stroke();

          const rCol = Math.round(220 + n.depth * 32);
          const gCol = Math.round(160 + n.depth * 52);
          const bCol = Math.round(68 + n.depth * 52);
          ctx.strokeStyle = `rgba(${rCol}, ${gCol}, ${bCol}, ${alpha})`;
          ctx.lineWidth = 4.7;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let s = 1; s < pts.length; s++) {
            ctx.lineTo(pts[s].x, pts[s].y);
          }
          ctx.stroke();

          if (n.depth > 0.62) {
            ctx.strokeStyle = `rgba(255, 244, 206, ${(n.depth - 0.52) * 0.62})`;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(pts[3].x, pts[3].y - 1.1);
            for (let s = 4; s < pts.length - 3; s++) {
              ctx.lineTo(pts[s].x, pts[s].y - 1.1);
            }
            ctx.stroke();
          }
        }
      }

      function drawBokChoy(time) {

        ctx.save();
        ctx.translate(-108, -22 + sway * 0.4);

        const leaves = [

          ctx.strokeStyle = 'rgba(182, 234, 168, 0.30)';

          ctx.beginPath();
          ctx.moveTo(lf.rx * 0.65, 0);
          ctx.quadraticCurveTo(0, -2, -lf.rx * 0.72, -3);

          ctx.restore();
        });

        const stems = [
          { yOff: -9, w: 12, len: 55, rot: -0.14 },

          stemGrad.addColorStop(0.85, '#e0f2ce');

          ctx.fillStyle = stemGrad;
          ctx.beginPath();
          ctx.moveTo(-14, st.yOff - st.w * 0.55);
          ctx.quadraticCurveTo(st.len * 0.5, st.yOff - st.w * 0.8, st.len, st.yOff - st.w * 0.35);
          ctx.quadraticCurveTo(st.len + 7, st.yOff, st.len, st.yOff + st.w * 0.35);
          ctx.quadraticCurveTo(st.len * 0.5, st.yOff + st.w * 0.8, -14, st.yOff + st.w * 0.55);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 242, 0.46)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-4, st.yOff - st.w * 0.22);
          ctx.quadraticCurveTo(st.len * 0.5, st.yOff - st.w * 0.35, st.len - 6, st.yOff - st.w * 0.12);
          ctx.stroke();
          ctx.restore();
        });

        ctx.restore();
      }

      function drawGlazedTofu(time) {
        const floatY = prefersReducedMotion ? 0 : Math.sin(time * 1.05 + 0.8) * 1.1;
        const slabs = [
          { x: -38, y: -68 + floatY, w: 66, h: 40, rot: -0.22 },

          ctx.fillStyle = 'rgba(45, 16, 4, 0.55)';
          ctx.beginPath();
          ctx.roundRect(-sl.w / 2 + 3, -sl.h / 2 + 6, sl.w, sl.h, 9);

          ctx.fillStyle = '#59250c';

          tofuGrad.addColorStop(0.0, '#eeb45b');

          ctx.fillStyle = tofuGrad;
          ctx.beginPath();
          ctx.roundRect(-sl.w / 2, -sl.h / 2, sl.w, sl.h - 2, 8);
          ctx.fill();

          ctx.strokeStyle = 'rgba(110, 42, 10, 0.72)';
          ctx.lineWidth = 2.2;
          ctx.stroke();

          ctx.save();
          ctx.clip();
          ctx.strokeStyle = 'rgba(68, 22, 5, 0.54)';
          ctx.lineWidth = 3.2;
          for (let gx = -sl.w; gx < sl.w; gx += 13) {
            ctx.beginPath();
            ctx.moveTo(gx, -sl.h);
            ctx.lineTo(gx + 18, sl.h);
            ctx.stroke();
          }
          for (let gx = -sl.w; gx < sl.w; gx += 15) {
            ctx.strokeStyle = 'rgba(82, 28, 6, 0.28)';

            ctx.beginPath();
            ctx.moveTo(gx + 16, -sl.h);
            ctx.lineTo(gx - 8, sl.h);

          ctx.save();

          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y - BROTH_Y, rp.r, rp.r * ASPECT, 0, 0, Math.PI * 2);

      function updateAndDrawOilDroplets(time, dt, brothRx, brothRy) {
        for (let i = 0; i < oilDroplets.length; i++) {
          const d = oilDroplets[i];

          if (!prefersReducedMotion) {
            const targetX = d.baseX + Math.cos(time * d.driftSpeed + d.driftPhase) * 4.5;
            const targetY = d.baseY + Math.sin(time * d.driftSpeed * 0.85 + d.driftPhase) * 2.8;

            if (pointer.inBroth) {
              const px = pointer.localX;
              const py = pointer.localY - BROTH_Y;
              const dx = d.x - px;
              const dy = d.y - py;
              const distSq = dx * dx + dy * dy;
              if (distSq < 3600 && distSq > 0.1) {
                const dist = Math.sqrt(distSq);
                const push = (1 - dist / 60) * 28 * dt;
                d.vx += (dx / dist) * push + pointer.vx * 0.018;
                d.vy += (dy / dist) * push + pointer.vy * 0.018;
              }
            }

            d.vx += (targetX - d.x) * 1.8 * dt;
            d.vy += (targetY - d.y) * 1.8 * dt;
            d.vx *= 0.92;
            d.vy *= 0.92;

            d.x += d.vx;
            d.y += d.vy;

            const norm = (d.x * d.x) / ((brothRx - 8) * (brothRx - 8)) + (d.y * d.y) / ((brothRy - 6) * (brothRy - 6));
            if (norm > 1) {
              const scale = 1 / Math.sqrt(norm);
              d.x *= scale;
              d.y *= scale;
            }
          }

          ctx.save();
          ctx.translate(d.x, d.y);
          ctx.rotate(d.rot);

          const rx = d.r * d.stretch;
          const ry = d.r * ASPECT * 1.15;

          if (d.isChili) {
            const chiliGrad = ctx.createRadialGradient(-rx * 0.25, -ry * 0.25, rx * 0.1, 0, 0, rx);
            chiliGrad.addColorStop(0, 'rgba(255, 118, 38, 0.90)');
            chiliGrad.addColorStop(0.55, 'rgba(202, 36, 8, 0.84)');
            chiliGrad.addColorStop(1, 'rgba(115, 14, 4, 0.65)');
            ctx.fillStyle = chiliGrad;
          } else {
            const goldGrad = ctx.createRadialGradient(-rx * 0.25, -ry * 0.25, rx * 0.1, 0, 0, rx);
            goldGrad.addColorStop(0, 'rgba(255, 242, 178, 0.74)');
            goldGrad.addColorStop(0.65, 'rgba(235, 170, 52, 0.48)');
            goldGrad.addColorStop(1, 'rgba(185, 110, 22, 0.28)');
            ctx.fillStyle = goldGrad;
          }

          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();

          if (d.r > 3.2) {
            ctx.fillStyle = 'rgba(255, 248, 228, 0.68)';
            ctx.beginPath();
            ctx.ellipse(-rx * 0.32, -ry * 0.3, Math.max(0.8, rx * 0.22), Math.max(0.6, ry * 0.2), 0, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      function updateAndDrawScallionsAndSesame(time, dt, brothRx, brothRy) {
        for (let i = 0; i < sesameSeeds.length; i++) {
          const s = sesameSeeds[i];
          const driftX = prefersReducedMotion ? 0 : Math.cos(time * 0.7 + s.phase) * 1.4;
          const driftY = prefersReducedMotion ? 0 : Math.sin(time * 0.6 + s.phase) * 0.9;

          ctx.save();
          ctx.translate(s.x + driftX, s.y + driftY);
          ctx.rotate(s.rot);

          ctx.fillStyle = s.isBlack ? '#1c1816' : '#f7e6c6';
          ctx.beginPath();
          ctx.ellipse(0, 0, 2.2, 1.15, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = 0; i < scallions.length; i++) {
          const sc = scallions[i];

          if (!prefersReducedMotion) {
            const tx = sc.baseX + Math.cos(time * 0.85 + sc.phase) * 2.2;
            const ty = sc.baseY + Math.sin(time * 0.75 + sc.phase) * 1.5;

            if (pointer.inBroth) {
              const dx = sc.x - pointer.localX;
              const dy = (sc.y + BROTH_Y) - pointer.localY;
              const dSq = dx * dx + dy * dy;
              if (dSq < 2500 && dSq > 0.1) {
                const dist = Math.sqrt(dSq);
                const push = (1 - dist / 50) * 18 * dt;
                sc.vx += (dx / dist) * push;
                sc.vy += (dy / dist) * push;
              }
            }

            sc.vx += (tx - sc.x) * 2.2 * dt;
            sc.vy += (ty - sc.y) * 2.2 * dt;
            sc.vx *= 0.9;
            sc.vy *= 0.9;
            sc.x += sc.vx;
            sc.y += sc.vy;

            const norm = (sc.x * sc.x) / ((brothRx - 14) * (brothRx - 14)) + (sc.y * sc.y) / ((brothRy - 10) * (brothRy - 10));
            if (norm > 1) {
              const scale = 1 / Math.sqrt(norm);
              sc.x *= scale;
              sc.y *= scale;
            }
          }

          ctx.save();
          ctx.translate(sc.x, sc.y);
          ctx.rotate(sc.rot);

          ctx.fillStyle = 'rgba(38, 15, 4, 0.36)';
          ctx.beginPath();
          ctx.ellipse(0.8, 1.6, sc.rOuter, sc.rOuter * sc.tilt, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `hsl(${106 + sc.hueShift}, 60%, 39%)`;
          ctx.beginPath();
          ctx.ellipse(0, 0, sc.rOuter, sc.rOuter * sc.tilt, 0, 0, Math.PI * 2);
          ctx.ellipse(0, 0, sc.rInner, sc.rInner * sc.tilt, 0, 0, Math.PI * 2, true);
          ctx.fill('evenodd');

          ctx.strokeStyle = 'rgba(220, 248, 200, 0.76)';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.ellipse(0, 0, sc.rInner + 0.5, (sc.rInner + 0.5) * sc.tilt, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.restore();
        }
      }

      // ============================================================================
      // VOLUMETRIC INTERACTIVE STEAM PLUMES & CURLING VAPOR WISPS
      // ============================================================================

      function updateAndDrawSteam(time, dt) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';

        // 1. Soft Volumetric Steam Clouds
        for (let i = 0; i < steamPlumes.length; i++) {
          const p = steamPlumes[i];

          if (!prefersReducedMotion) {
            p.life += p.speed * dt;
            if (p.life >= 1) {
              Object.assign(p, createSteamParticle(0));
            }

            const rise = p.life * 335;
            const naturalSway = Math.sin(time * p.swayFreq + p.phase + p.life * 3.8) * p.swayAmp * Math.pow(p.life, 0.75);

            if (pointer.active) {
              const px = pointer.localX;
              const py = pointer.localY;
              const dx = (p.originX + naturalSway + p.vx) - px;
              const dy = (p.originY - rise) - py;
              const distSq = dx * dx + dy * dy;
              const influenceR = 150;
              if (distSq < influenceR * influenceR) {
                const dist = Math.sqrt(distSq) + 1;
                const falloff = Math.pow(1 - dist / influenceR, 1.5);
                p.vx += ((dx / dist) * 98 + pointer.vx * 2.5) * falloff * dt;
              }
            }

            p.vx *= Math.pow(0.45, dt);
            p.x = p.originX + naturalSway + p.vx;
            p.y = p.originY - rise;
          } else {
            const rise = p.life * 280;
            const staticSway = Math.sin(p.phase + p.life * 3.2) * (p.swayAmp * 0.7) * p.life;
            p.x = p.originX + staticSway;
            p.y = p.originY - rise;
          }

          const fadeIn = Math.min(1, p.life / 0.18);
          const fadeOut = Math.pow(Math.max(0, 1 - p.life), 1.45);
          const alpha = p.opacity * fadeIn * fadeOut;
          if (alpha <= 0.002) continue;

          const curR = p.baseRadius + (p.maxRadius - p.baseRadius) * Math.pow(p.life, 0.82);

          const warmth = Math.max(0, 1 - p.life * 1.15);
          const rCol = Math.round(218 + warmth * 37);
          const gCol = Math.round(200 + warmth * 14);
          const bCol = Math.round(190 - warmth * 38);

          const sGrad = ctx.createRadialGradient(p.x, p.y, curR * 0.08, p.x, p.y, curR);
          sGrad.addColorStop(0.0, `rgba(${rCol}, ${gCol}, ${bCol}, ${alpha})`);
          sGrad.addColorStop(0.48, `rgba(${rCol - 12}, ${gCol - 14}, ${bCol - 10}, ${alpha * 0.48})`);
          sGrad.addColorStop(1.0, `rgba(${rCol - 20}, ${gCol - 20}, ${bCol - 15}, 0)`);

          ctx.fillStyle = sGrad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, curR, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Silky Curling Vapor Wisps (Expressive rising culinary steam tendrils)
        for (let i = 0; i < steamWisps.length; i++) {
          const w = steamWisps[i];
          if (!prefersReducedMotion) {
            w.life += w.speed * dt;
            if (w.life >= 1) {
              Object.assign(w, createSteamWisp(0));
            }

            if (pointer.active) {
              const midY = w.originY - w.life * w.height * 0.6;
              const dx = (w.originX + w.vx) - pointer.localX;
              const dy = midY - pointer.localY;
              const dSq = dx * dx + dy * dy;
              if (dSq < 18000) {
                const d = Math.sqrt(dSq) + 1;
                const falloff = 1 - d / 135;
                w.vx += ((dx / d) * 75 + pointer.vx * 2.2) * falloff * dt;
              }
            }
            w.vx *= Math.pow(0.5, dt);
          }

          const fadeIn = Math.min(1, w.life / 0.22);
          const fadeOut = Math.pow(Math.max(0, 1 - w.life), 1.35);
          const alpha = w.opacity * fadeIn * fadeOut;
          if (alpha <= 0.002) continue;

          const baseY = w.originY - w.life * 85;
          const topY = baseY - w.height * (0.45 + w.life * 0.55);
          const phase = (prefersReducedMotion ? 0 : time * 1.4) + w.phase;
          const windX = w.vx + pointer.smoothNx * 22 * w.life;

          const sx = w.originX + w.vx * 0.25;
          const c1x = sx + Math.sin(phase) * w.curlAmp * w.curlDir + windX * 0.35;
          const c1y = baseY + (topY - baseY) * 0.35;
          const c2x = sx - Math.cos(phase * 0.85) * w.curlAmp * 1.15 * w.curlDir + windX * 0.75;
          const c2y = baseY + (topY - baseY) * 0.72;
          const ex = sx + Math.sin(phase * 0.7 + 1.2) * w.curlAmp * 0.9 * w.curlDir + windX;

          const wGrad = ctx.createLinearGradient(sx, baseY, ex, topY);
          wGrad.addColorStop(0.0, 'rgba(255, 224, 185, 0)');
          wGrad.addColorStop(0.25, `rgba(255, 232, 205, ${alpha})`);
          wGrad.addColorStop(0.68, `rgba(235, 226, 218, ${alpha * 0.72})`);
          wGrad.addColorStop(1.0, 'rgba(215, 212, 210, 0)');

          ctx.strokeStyle = wGrad;
          ctx.lineWidth = w.thickness * (0.7 + w.life * 0.65);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(sx, baseY);
          ctx.bezierCurveTo(c1x, c1y, c2x, c2y, ex, topY);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawAmbientMotesAndVignette(time, dt) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scaleFactor, scaleFactor);
        ctx.globalCompositeOperation = 'screen';

        for (let i = 0; i < ambientMotes.length; i++) {
          const m = ambientMotes[i];
          if (!prefersReducedMotion) {
            m.y -= m.speedY * dt;
            if (m.y < -390) {
              m.y = 230;
              m.x = (Math.random() * 2 - 1) * 420;
            }
          }
          const mx = m.x + (prefersReducedMotion ? 0 : Math.sin(time * 0.7 + m.phase) * m.sway) + pointer.smoothNx * 16;
          const my = m.y + pointer.smoothNy * 10;
          const twinkle = prefersReducedMotion ? 0.7 : 0.55 + 0.45 * Math.sin(time * 2.1 + m.phase);

          const mGrad = ctx.createRadialGradient(mx, my, 0, mx, my, m.r * 3.2);
          mGrad.addColorStop(0, `rgba(255, 214, 148, ${m.alpha * twinkle})`);
          mGrad.addColorStop(0.5, `rgba(235, 148, 65, ${m.alpha * twinkle * 0.35})`);
          mGrad.addColorStop(1, 'rgba(200, 100, 30, 0)');

          ctx.fillStyle = mGrad;
          ctx.beginPath();
          ctx.arc(mx, my, m.r * 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Cinematic Dark Atmospheric Vignette framing the hero ramen bowl
        const vigGrad = ctx.createRadialGradient(
          centerX, centerY - 20 * scaleFactor, Math.min(width, height) * 0.28,
          centerX, centerY, Math.max(width, height) * 0.76
        );
        vigGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
        vigGrad.addColorStop(0.65, 'rgba(4, 3, 2, 0.35)');
        vigGrad.addColorStop(1.0, 'rgba(3, 2, 2, 0.88)');

        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, width, height);
      }

      // ============================================================================
      // MAIN RENDER LOOP
      // ============================================================================

      let lastTime = performance.now();

      function render(now) {
        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(0.05, Math.max(0.001, rawDt));
        const time = now * 0.001;

        const targetNx = pointer.active ? pointer.nx : 0;
        const targetNy = pointer.active ? pointer.ny : 0;
        const lerpRate = prefersReducedMotion ? 1 : Math.min(1, dt * 5.5);
        pointer.smoothNx += (targetNx - pointer.smoothNx) * lerpRate;
        pointer.smoothNy += (targetNy - pointer.smoothNy) * lerpRate;

        pointer.vx *= 0.85;
        pointer.vy *= 0.85;

        ctx.save();
        ctx.scale(dpr, dpr);

        // 1. Atmospheric Spotlight & Charred Walnut Table
        drawBackgroundAndTable(time);

        // 2. Artisan Chopsticks & River-Stone Rest
        const bowlTiltX = pointer.smoothNx * 14;
        const bowlTiltY = pointer.smoothNy * 9;
        drawChopsticks(bowlTiltX, bowlTiltY);

        // 3. Hero Steaming Vegan Ramen Bowl (Layered back-to-front for natural 3D depth)
        ctx.save();
        ctx.translate(centerX + bowlTiltX * scaleFactor, centerY + bowlTiltY * scaleFactor);
        ctx.scale(scaleFactor, scaleFactor);

        drawBowlExteriorAndInteriorWall();
        drawBowlBackRimAndNori(time);
        drawBrothAndContents(time, dt);
        drawBowlFrontRim();
        updateAndDrawSteam(time, dt);

        ctx.restore();

        // 4. Floating Golden Heat Motes & Atmospheric Vignette
        drawAmbientMotesAndVignette(time, dt);

        ctx.restore();

        requestAnimationFrame(render);
      }

      initSceneData();
      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
