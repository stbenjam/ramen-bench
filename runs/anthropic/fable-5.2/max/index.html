/* the pointer is a small warm lantern */
function drawPointerGlow(g) {
  const a = light.presence * light.power;
  if (a < 0.01) return;
  g.globalCompositeOperation = 'lighter';
  blob(g, light.x, light.y, 1.05, 1.05, rgba(255, 150, 70, 0.11 * a), 'rgba(255,120,40,0)', [0.35, rgba(255, 140, 60, 0.038 * a)]);
  blob(g, light.x, light.y, 0.13, 0.13, rgba(255, 220, 170, 0.30 * a), 'rgba(255,190,120,0)', [0.3, rgba(255, 204, 146, 0.10 * a)]);

/* ==========================================================================
   Putting it together: build, frame loop, input, reduced motion.
   ========================================================================== */
let bgLayer = null, bowl = null, chop = null;
let simT = 0, lastTs = 0, raf = 0, built = false;
let nextDrip = 2.5;
const dripR = rng(4711);

function rebuild() {
  measure();
  canvas.width = round(view.W * view.dpr); canvas.height = round(view.H * view.dpr);
  bgLayer = buildBackground();
  bowl = buildBowl();
  exteriorClip = null;
  buildFood();
  chop = makeSprite(0.5, -0.62, 1.2, 0.74, g => paintChopsticks(g));
  buildFloaterSprites();
  buildGlintSprite();
  if (!floaters.length) initFloaters();
  if (steam.resize(quality.steam)) {
    /* run ahead, so the bowl is already steaming in the very first frame — with
       reduced motion that frame is the whole picture, so it gets all the time it needs */
    const ms = steam.warm(84, 0.066, reduced ? 1500 : built ? 150 : 450);
    /* a slow machine gets a coarser simulation from the start (timed while the engine is still cold, hence generous) */
    if (!built && !reduced && ms > 8 && quality.steam > 0) { quality.steam = 0; steam.resize(0); steam.warm(84, 0.066, 300); }
  }
  built = true;
}

function update(dt, t) {
  updateLight(dt, t);
  if (reduced) return;
  /* the pointer's own motion decays when it rests */
  const still = now() / 1000 - pointer.t;
  if (still > 0.08) { pointer.vx *= exp(-dt * 8); pointer.vy *= exp(-dt * 8); }
  /* now and then a bubble breaks the surface on its own */
  nextDrip -= dt;
  if (nextDrip <= 0) {
    nextDrip = 2.2 + dripR() * 4.5;
    for (let i = 0; i < 12; i++) {
      const a = dripR() * TAU, q = sqrt(dripR()) * 0.8, x = cos(a) * q, z = sin(a) * q;
      if (z < 0.6 && isOpen(x, z, 0.03)) { addRipple(x, z, 0.38 + dripR() * 0.25); break; }
    }
  }
  updateFloaters(dt, t);
  const s0 = now(); steam.step(dt); stepMs = now() - s0;
}

function render(t, dt) {
  const g = ctx, K = view.K;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'copy';
  g.drawImage(bgLayer, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.setTransform(K, 0, 0, K, view.ox, view.oy);

  drawTableLight(g);
  g.drawImage(bowl.cv, bowl.x, bowl.y, bowl.w, bowl.h);
  drawBroth(g, t);
  drawBowlLight(g);

  /* food, bobbing gently and lifted by passing ripples */
  g.save(); clipFood(g);
  for (const sp of sprites) {
    if (reduced || !sp.bob) { g.drawImage(sp.cv, sp.x, sp.y, sp.w, sp.h); if (sp.glints) drawGlints(g, sp.glints); continue; }
    let dy = sin(t * sp.fr + sp.ph) * 0.0034 * sp.bob;
    const rot = sin(t * sp.fr * 0.71 + sp.ph * 1.7) * 0.0075 * sp.bob;
    for (const r of ripples) {
      const e = hypot(sp.sx - r.x, sp.sz - r.z) - r.rad;
      if (e > -0.22 && e < 0.22) dy -= r.fade * 0.0075 * sp.bob * cos(e * 14) * (1 - abs(e) / 0.22);
    }
    g.save(); g.translate(sp.ax, sp.ay + dy); g.rotate(rot);
    g.drawImage(sp.cv, sp.x - sp.ax, sp.y - sp.ay, sp.w, sp.h);
    g.restore();
    if (sp.glints) drawGlints(g, sp.glints);
  }
  g.restore();
  drawFoodLight(g);
  g.drawImage(chop.cv, chop.x, chop.y, chop.w, chop.h);
  if (chop.glints) drawGlints(g, chop.glints);

  steam.render(light.x, light.y, 0.55 + 0.45 * light.presence);
  steam.draw(g);
  drawMotes(g, t, dt);
  drawPointerGlow(g);
}

/* ---------- frame loop ---------- */
/* If frames come slowly the scene quietly simplifies itself: first a coarser
   steam grid (when the simulation is the cost), then fewer pixels. */
let accDelta = 0, accStep = 0, accN = 0, frames = 0, stepMs = 0, tunes = 0;
function frame(ts) {
  raf = 0;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  const real = dt;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  dt = min(dt, 1 / 24);
  simT += dt;
  stepMs = 0;
  update(dt, simT);
  render(simT, dt);
  frames++;
  if (frames > 15 && real > 0 && real < 0.25 && tunes < 4) {
    accDelta += real * 1000; accStep += stepMs; accN++;
    if (accN >= 45) {
      const ad = accDelta / accN, as = accStep / accN;
      accDelta = accStep = accN = 0;
      if (ad > 31) {
        if (as > 5 && quality.steam > 0) { quality.steam--; if (steam.resize(quality.steam)) steam.warm(70, 0.05, 120); tunes++; }
        else if (ad > 40 && view.dpr > 1.05) { quality.maxDpr = max(1, view.dpr * 0.75); rebuild(); tunes++; }
        else if (ad > 42 && as > 2.2 && quality.steam > 0) { quality.steam = 0; if (steam.resize(0)) steam.warm(70, 0.05, 120); tunes++; }
        else tunes += 0.5;
      }
    }
  }
  if (!reduced && !document.hidden) raf = requestAnimationFrame(frame);
}
function start() {
  if (raf || reduced || document.hidden) return;
  lastTs = now();
  raf = requestAnimationFrame(frame);
}
function still() {                        // one composed frame, no motion
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  update(0, simT); render(simT, 0);
}

/* ---------- input ---------- */
function toUnits(e) { return [(e.clientX * view.dpr - view.ox) / view.K, (e.clientY * view.dpr - view.oy) / view.K]; }
let stillRaf = 0, stillUntil = 0;
function easeStill() {                    // reduced motion: let only the light settle, then stop
  if (stillRaf) return;
  const tick = () => {
    stillRaf = 0;
    updateLight(1 / 30, simT); render(simT, 0);
    if (now() < stillUntil) stillRaf = requestAnimationFrame(tick);
  };
  stillRaf = requestAnimationFrame(tick);
}
function onMove(e) {
  const q = toUnits(e), x = q[0], y = q[1], tn = now() / 1000;
  if (pointer.has) {
    const dtp = clamp(tn - pointer.t, 0.004, 0.1), dx = x - pointer.x, dy = y - pointer.y, dist = hypot(dx, dy);
    pointer.vx = lerp(pointer.vx, dx / dtp, 0.5); pointer.vy = lerp(pointer.vy, dy / dtp, 0.5);
    if (!reduced && dist > 0) {
      /* stir the air */
      const gain = 2.2 * (0.5 + min(1.5, (dist / dtp) * 0.22)), n = max(1, min(6, ceil(dist / 0.12)));
      for (let i = 1; i <= n; i++) steam.push(pointer.x + dx * i / n, pointer.y + dy * i / n, dx / n * gain, dy / n * gain, 0.17);
      /* trail ripples across the broth */
      if (onBroth(x, y)) {
        pointer.trail += dist;
        if (pointer.trail > 0.10) { pointer.trail = 0; addRipple(x, (y - YB) / SQ, 0.40); }
      }
    }
  }
  pointer.x = x; pointer.y = y; pointer.t = tn; pointer.has = true;
  if (reduced) { stillUntil = now() + 500; easeStill(); }
}
function onDown(e) {
  onMove(e);
  if (reduced) return;
  const x = pointer.x, y = pointer.y;
  if (onBroth(x, y)) {
    addRipple(x, (y - YB) / SQ, 1.0);
    steam.puff(x, y - 0.06, 0.75, 0.11);
    steam.push(x, y - 0.1, 0, -1.3, 0.2);
  } else {
    /* a breath of air */
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; steam.push(x + cos(a) * 0.16, y + sin(a) * 0.16, cos(a) * 0.75, sin(a) * 0.75, 0.2); }
  }
}
function onLeave(e) {
  if (e.type !== 'pointerleave' && e.pointerType === 'mouse') return;
  pointer.has = false; pointer.vx = pointer.vy = 0;
  if (reduced) { stillUntil = now() + 1600; easeStill(); }
}
canvas.addEventListener('pointermove', onMove, { passive: true });
canvas.addEventListener('pointerdown', onDown, { passive: true });
canvas.addEventListener('pointerup', onLeave, { passive: true });
canvas.addEventListener('pointercancel', onLeave, { passive: true });
canvas.addEventListener('pointerleave', onLeave, { passive: true });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- reduced motion, visibility, resize ---------- */
const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
function setReduced(v) {
  reduced = !!v;
  if (!built) return;
  if (reduced) still(); else start();
}
if (mq) {
  reduced = mq.matches;
  const onMq = e => setReduced(e.matches);
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else if (!reduced) start(); else still(); });

let resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const q = viewport();
    if (q[0] === view.W && q[1] === view.H && abs(q[2] - view.dpr) < 0.01) return;
    rebuild();
    if (reduced) still(); else { render(simT, 0); start(); }
  }, 140);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
/* a window dragged to a screen of another density changes its pixel ratio without resizing */
(function watchDensity() {
  if (!window.matchMedia) return;
  const m = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
  if (m.addEventListener) m.addEventListener('change', () => { onResize(); watchDensity(); }, { once: true });
})();
/* if the browser ever throws the canvas away, every layer is painted afresh */
canvas.addEventListener('contextrestored', () => { rebuild(); if (reduced) still(); else { render(simT, 0); start(); } });

/* ---------- go ---------- */
rebuild();
deriveLight();
if (reduced) still(); else { update(1 / 60, simT); render(simT, 0); start(); }

})();

</script>
</body>
</html>
