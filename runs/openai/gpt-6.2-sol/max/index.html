<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Vegan ramen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #100d0c; }
    .scene { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; isolation: isolate; }
    canvas { display: block; pointer-events: none; }
    .table { position: absolute; inset: 0; width: 100%; height: 100%; }
    .dish, .steam { position: absolute; }
    .dish canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main class="scene" role="img" aria-label="Steam curling over a dark ceramic bowl of vegan ramen with golden tofu, shiitake mushrooms and bok choy">
    <canvas class="table" aria-hidden="true"></canvas>
    <div class="dish" aria-hidden="true">
      <canvas class="ceramic"></canvas>
      <canvas class="reflections"></canvas>
      <canvas class="toppings"></canvas>
    </div>
    <canvas class="steam" aria-hidden="true"></canvas>
  </main>
  <script>
    (() => {
      'use strict';

      const scene = document.querySelector('.scene');
      const table = document.querySelector('.table');
      const dish = document.querySelector('.dish');
      const ceramic = document.querySelector('.ceramic');
      const reflections = document.querySelector('.reflections');
      const toppings = document.querySelector('.toppings');
      const steam = document.querySelector('.steam');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');

      const tau = 2 * Math.PI;
      const origin = { x: 550, y: 434 };
      const art = { x: 132, y: 265, width: 836, height: 453 };
      const vapor = { x: 164, bottom: 502, width: 772, height: 485 };
      const liquid = { x: 550, y: 438, rx: 370, ry: 132 };
      const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
      const mix = (a, b, t) => a + (b - a) * t;
      const smooth = (a, b, v) => {
        const t = clamp((v - a) / (b - a));
        return t * t * (3 - 2 * t);
      };

      function random(seed) {
        return () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
      }

      function hash(x, y) {
        let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
      }

      function noise(x, y) {
        const i = Math.floor(x);
        const j = Math.floor(y);
        let u = x - i;
        let v = y - j;
        u *= u * (3 - 2 * u);
        v *= v * (3 - 2 * v);
        return mix(mix(hash(i, j), hash(i + 1, j), u),
          mix(hash(i, j + 1), hash(i + 1, j + 1), u), v);
      }

      function linear(ctx, x0, y0, x1, y1, stops) {
        const gradient = ctx.createLinearGradient(x0, y0, x1, y1);
        for (const [offset, color] of stops) gradient.addColorStop(offset, color);
        return gradient;
      }

      function oval(x, y, rx, ry, angle = 0) {
        const path = new Path2D();
        path.ellipse(x, y, rx, ry, angle, 0, tau);
        return path;
      }

      function blot(ctx, x, y, rx, ry, stops, angle = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(rx, ry);
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        for (const [offset, color] of stops) glow.addColorStop(offset, color);
        ctx.fillStyle = glow;
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
      }

      function stroke(ctx, path, color, width) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke(path);
      }

      function fill(ctx, path, color) {
        ctx.fillStyle = color;
        ctx.fill(path);
      }

      function curve(points, closed = false) {
        const path = new Path2D();
        path.moveTo(...points[0]);
        for (let i = 0; i < points.length - (closed ? 0 : 1); i++) {
          const a = points[closed ? (i - 1 + points.length) % points.length : Math.max(0, i - 1)];
          const b = points[i];
          const c = points[(i + 1) % points.length];
          const d = points[closed ? (i + 2) % points.length : Math.min(points.length - 1, i + 2)];
          path.bezierCurveTo(
            b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6,
            c[0] - (d[0] - b[0]) / 6, c[1] - (d[1] - b[1]) / 6,
            ...c
          );
        }
        if (closed) path.closePath();
        return path;
      }

      function rounded(points, fraction) {
        const path = new Path2D();
        points.forEach((point, i) => {
          const prev = points[(i - 1 + points.length) % points.length];
          const next = points[(i + 1) % points.length];
          const from = [mix(point[0], prev[0], fraction), mix(point[1], prev[1], fraction)];
          const to = [mix(point[0], next[0], fraction), mix(point[1], next[1], fraction)];
          if (i === 0) path.moveTo(...from);
          else path.lineTo(...from);
          path.quadraticCurveTo(...point, ...to);
        });
        path.closePath();
        return path;
      }

      function thrownEdge(x, y, rx, ry, start = 0, end = tau) {
        const path = new Path2D();
        const steps = Math.ceil((end - start) * 23);
        const roughness = Math.min(1, ry * 0.27);
        for (let i = 0; i <= steps; i++) {
          const angle = mix(start, end, i / steps);
          const ruffle = roughness * (Math.sin(angle * 5 + 1.7) * 0.72 + Math.sin(angle * 9 - 0.4) * 0.41);
          const px = x + Math.cos(angle) * (rx + ruffle);
          const py = y + Math.sin(angle) * (ry + ruffle * 0.55);
          if (i === 0) path.moveTo(px, py);
          else path.lineTo(px, py);
        }
        if (end - start >= tau) path.closePath();
        return path;
      }

      function paintTable(width, height, scale, centerX, centerY) {
        const density = Math.min(1, 1120 / width, 820 / height);
        table.width = Math.max(1, Math.round(width * density));
        table.height = Math.max(1, Math.round(height * density));
        const ctx = table.getContext('2d', { alpha: false });
        const image = ctx.createImageData(table.width, table.height);
        const pixels = image.data;
        const rng = random(1657);

        for (let py = 0; py < table.height; py++) {
          const y = (py / density - centerY) / scale;
          const screenY = py / table.height - 0.49;
          const surface = smooth(-340, 150, y);
          for (let px = 0; px < table.width; px++) {
            const x = (px / density - centerX) / scale;
            const screenX = px / table.width - 0.5;
            const falloff = clamp(1 - 1.18 * screenX ** 2 - 0.97 * screenY ** 2);
            const glow = Math.exp(-(((x + 215) / 510) ** 2 + ((y + 106) / 334) ** 2));
            const bounce = Math.exp(-(((x + 208) / 484) ** 2 + ((y - 206) / 213) ** 2));
            const clouds = noise(x * 0.009 - 9, y * 0.011) - 0.5;
            const board = y + x * 0.095 + 6 * noise(x * 0.007, y * 0.02);
            const grain = noise(x * 0.013, board * 0.29) - 0.5;
            const fibers = noise(x * 0.036 + 17, board * 0.83) - 0.5;
            const grit = (rng() - 0.5) * 4 + clouds * (2 + 8 * surface)
              + (grain * 5.5 + fibers * 3) * surface;
            const i = 4 * (py * table.width + px);
            pixels[i] = (10 + glow * 34 + bounce * 12 + grit) * falloff + 2;
            pixels[i + 1] = (9 + glow * 20 + bounce * 7 + grit * 0.8) * falloff + 2;
            pixels[i + 2] = (9 + glow * 13 + bounce * 4 + grit * 0.68) * falloff + 2;
            pixels[i + 3] = 255;
          }
        }
        ctx.putImageData(image, 0, 0);
        ctx.setTransform(scale * density, 0, 0, scale * density,
          (centerX - origin.x * scale) * density, (centerY - origin.y * scale) * density);
        blot(ctx, 405, 653, 502, 113, [
          [0, '#c1753e28'], [0.45, '#af56221b'], [0.75, '#8f471012'], [1, '#8f471000']
        ], 0.045);
        blot(ctx, 652, 655, 497, 129, [
          [0, '#080607ed'], [0.49, '#090607c0'], [0.68, '#0a070788'], [1, '#0a070700']
        ], 0.085);
        blot(ctx, 558, 687, 288, 52, [
          [0, '#030203'], [0.62, '#060404d9'], [1, '#06040400']
        ], 0.024);
      }

      const outerLip = thrownEdge(550, 433, 403, 155);
      const innerLip = thrownEdge(550, 434, 386, 142);
      const soup = thrownEdge(liquid.x, liquid.y, liquid.rx, liquid.ry);
      const bowlTilt = 155 / 403;

      function bowlSection(depth) {
        const rx = 403 - 223 * depth * (0.105 + 0.895 * depth);
        const cy = 433 + 200 * depth;
        const ry = rx * bowlTilt;
        const visibleAngle = Math.asin(bowlTilt * 223 * (0.105 + 1.79 * depth) / 200);
        return { rx, cy, ry, visibleAngle };
      }

      function bowlSilhouette() {
        const sections = Array.from({ length: 160 }, (_, i) => bowlSection(i / 159));
        const outline = thrownEdge(550, 433, 403, 155, Math.PI, tau);
        // The front of the projected bowl is the lowest point of its cross sections at each x.
        for (let i = 0; i <= 360; i++) {
          const x = mix(403, -403, i / 360);
          let y = 433;
          for (const { rx, cy, ry } of sections) {
            if (Math.abs(x) <= rx) y = Math.max(y, cy + ry * Math.sqrt(1 - (x / rx) ** 2));
          }
          outline.lineTo(550 + x, y);
        }
        outline.closePath();
        return outline;
      }

      const hull = bowlSilhouette();

      function paintCeramic(ctx) {
        fill(ctx, oval(551, 641, 176, 67), linear(ctx, 534, 677, 561, 709, [
          [0, '#2e1f1a'], [0.55, '#191011'], [0.85, '#100a0b'], [1, '#231411']
        ]));
        const footEdge = new Path2D();
        footEdge.ellipse(551, 642, 175, 65, 0, 0.63, 2.49);
        stroke(ctx, footEdge, linear(ctx, 403, 688, 683, 700, [
          [0, '#30171800'], [0.29, '#98674562'], [0.62, '#49282042'], [1, '#17111100']
        ]), 1.08);

        fill(ctx, hull, linear(ctx, 416, 486, 488, 705, [
          [0, '#48302a'], [0.36, '#322522'], [0.68, '#1f1716'], [0.92, '#141010'], [1, '#100d0d']
        ]));
        ctx.save();
        ctx.clip(hull);
        blot(ctx, 332, 570, 335, 110, [
          [0, '#a566435c'], [0.36, '#91624443'], [0.7, '#6e413022'], [1, '#6e413000']
        ], 0.24);
        blot(ctx, 529, 616, 308, 80, [
          [0, '#9c583728'], [0.57, '#7942311a'], [1, '#79423100']
        ], 0.025);
        blot(ctx, 866, 555, 152, 110, [
          [0, '#773d2c57'], [0.49, '#5c312842'], [1, '#5c312800']
        ], -0.42);
        fill(ctx, hull, linear(ctx, 360, 540, 860, 669, [
          [0, '#0c080800'], [0.48, '#0a060608'], [0.77, '#08050955'], [1, '#09060895']
        ]));

        const rng = random(450);
        for (let i = 0; i < 104; i++) {
          const depth = (i + mix(0.16, 0.84, rng())) / 104;
          const { rx, cy, ry, visibleAngle } = bowlSection(depth);
          const alpha = 0.008 + rng() ** 2 * 0.047;
          const path = thrownEdge(550, cy, rx, ry, visibleAngle, Math.PI - visibleAngle);
          stroke(ctx, path, linear(ctx, 250, cy, 811, cy + 48, [
            [0, 'rgba(236,158,110,' + alpha * 0.84 + ')'],
            [0.31, 'rgba(255,190,144,' + alpha + ')'],
            [0.64, 'rgba(216,135,99,' + alpha * 0.28 + ')'],
            [0.91, 'rgba(213,114,77,' + alpha * 0.56 + ')']
          ]), mix(0.32, 1.35, rng()));
          if (i % 3 === 2) {
            stroke(ctx, thrownEdge(550, cy + 0.9, rx - 0.8, ry, visibleAngle, Math.PI - visibleAngle),
              '#08040620', 0.73);
          }
        }

        for (let i = 0; i < 19000; i++) {
          const x = mix(149, 957, rng());
          const y = mix(467, 706, rng());
          const grain = noise(x * 0.029, y * 0.08);
          const lit = Math.exp(-(((x - 337) / 364) ** 2 + ((y - 576) / 139) ** 2));
          ctx.fillStyle = rng() < 0.45
            ? 'rgba(232,166,116,' + (0.018 + grain * lit * rng() * 0.16) + ')'
            : 'rgba(8,4,5,' + (rng() * 0.29) + ')';
          const length = mix(0.36, 2.8, rng());
          ctx.fillRect(x, y, length, mix(0.35, 1.15, rng()));
        }
        for (let i = 0; i < 45; i++) {
          const x = mix(200, 881, rng());
          const y = mix(532, 699, rng());
          const length = mix(2, 32, rng());
          const slant = clamp((550 - x) / 450, -1, 1) * 0.43;
          const line = new Path2D();
          line.moveTo(x, y);
          line.quadraticCurveTo(x + length * 0.45, y + slant * length * 0.53,
            x + length, y + slant * length);
          stroke(ctx, line, '#b181633a', mix(0.25, 0.63, rng()));
        }
        ctx.restore();

        fill(ctx, outerLip, linear(ctx, 345, 298, 721, 598, [
          [0, '#876451'], [0.17, '#543b31'], [0.42, '#34231f'],
          [0.65, '#6d4938'], [0.84, '#4b322b'], [1, '#2b201e']
        ]));
        stroke(ctx, outerLip, '#130c0b', 1.4);
        fill(ctx, innerLip, linear(ctx, 500, 295, 614, 580, [
          [0, '#1d110e'], [0.13, '#49261a'], [0.34, '#3f251a'],
          [0.66, '#20100c'], [0.92, '#482116'], [1, '#2b170f']
        ]));
        stroke(ctx, innerLip, '#1c110f', 1.7);

        ctx.save();
        ctx.clip(outerLip);
        const ring = new Path2D();
        ring.rect(140, 270, 820, 328);
        ring.addPath(thrownEdge(550, 435, 381, 139));
        ctx.clip(ring, 'evenodd');
        blot(ctx, 294, 325, 340, 68, [
          [0, '#e8bb8c8e'], [0.41, '#d1976663'], [0.75, '#c4884240'], [1, '#c4884200']
        ], -0.27);
        blot(ctx, 434, 572, 283, 48, [
          [0, '#db92645b'], [0.7, '#b3724b38'], [1, '#b3724b00']
        ], 0.08);
        for (let i = 0; i < 4100; i++) {
          const angle = rng() * tau;
          const radius = mix(0.94, 1.008, rng());
          const x = 550 + 403 * radius * Math.cos(angle);
          const y = 433 + 155 * radius * Math.sin(angle);
          ctx.fillStyle = rng() > 0.55 ? '#f2bd8e32' : '#10090766';
          ctx.fillRect(x, y, mix(0.35, 2.2, rng()), mix(0.36, 1, rng()));
        }
        ctx.restore();

        stroke(ctx, thrownEdge(550, 433, 401, 154, 3.08, 6.21),
          linear(ctx, 148, 388, 889, 330, [
            [0, '#6b4e41'], [0.22, '#e1b493b9'], [0.53, '#bd8a70ac'],
            [0.78, '#784d3d80'], [1, '#58362b36']
          ]), 2.15);
        stroke(ctx, thrownEdge(550, 433, 397, 151, 3.19, 5.94), '#21110f9c', 1.12);
        stroke(ctx, thrownEdge(550, 433, 396, 151, 0.14, 3.13),
          linear(ctx, 183, 520, 924, 487, [
            [0, '#99705a3c'], [0.21, '#dda17b9d'], [0.5, '#ca815a5e'],
            [0.77, '#95533b2f'], [1, '#b7714966']
          ]), 1.85);
        stroke(ctx, thrownEdge(550, 433, 402, 155, 0.03, 3.1),
          linear(ctx, 151, 450, 951, 452, [
            [0, '#d6a27f89'], [0.17, '#a0684c72'], [0.54, '#9f624563'], [1, '#ac654d70']
          ]), 1.55);
        stroke(ctx, thrownEdge(550, 435, 390, 144, 0.07, 3.06), '#2e1711aa', 1.46);
        stroke(ctx, thrownEdge(550, 436, 381, 137, 3.04, 6.15),
          linear(ctx, 180, 413, 861, 346, [
            [0, '#a9664482'], [0.28, '#a4765045'], [0.67, '#63392146'], [1, '#96715730']
          ]), 2.3);
      }

      function brothMap() {
        const texture = document.createElement('canvas');
        texture.width = 744;
        texture.height = 268;
        const ctx = texture.getContext('2d');
        const image = ctx.createImageData(texture.width, texture.height);
        const pixels = image.data;
        const rng = random(24601);
        for (let py = 0; py < texture.height; py++) {
          const y = (py - 134) / 132;
          for (let px = 0; px < texture.width; px++) {
            const x = (px - 372) / 370;
            const i = (py * texture.width + px) * 4;
            const pool = noise(px * 0.016 + 8, py * 0.031);
            const ripple = noise(px * 0.032 + 9 * pool, py * 0.065 + 3.2 * pool);
            const oil = smooth(0.36, 0.69, pool * 0.58 + ripple * 0.42);
            const spice = noise(px * 0.135, py * 0.222);
            const depth = clamp(1 - Math.abs(y + 0.13) * 0.44 - Math.abs(x + 0.09) * 0.12);
            const glow = Math.exp(-(((x + 0.47) * 1.53) ** 2 + ((y - 0.21) * 1.05) ** 2));
            const rim = smooth(0.72, 1.01, x * x + y * y);
            const grit = (rng() - 0.5) * 8 + spice * 7;
            const caustic = (ripple - 0.5) * 16 + (pool - 0.5) * 15;
            pixels[i] = 49 + 87 * depth + 41 * glow + oil * 26 - rim * 27 + caustic + grit;
            pixels[i + 1] = 15 + 42 * depth + 21 * glow + oil * 19 - rim * 14 + caustic * 0.72 + grit;
            pixels[i + 2] = 9 + 13 * depth + 8 * glow + oil * 2 - rim * 5 + caustic * 0.37 + grit * 0.5;
            pixels[i + 3] = 255;
          }
        }
        ctx.putImageData(image, 0, 0);
        return texture;
      }

      function paintBroth(ctx) {
        fill(ctx, soup, '#a45320');
        ctx.save();
        ctx.clip(soup);
        ctx.drawImage(brothMap(), 178, 304);
        const ridge = linear(ctx, 516, 306, 563, 550, [
          [0, '#1c0e0ede'], [0.12, '#2e0e08a0'], [0.3, '#30130c39'],
          [0.68, '#2e110900'], [1, '#a9430e22']
        ]);
        fill(ctx, soup, ridge);
        blot(ctx, 269, 454, 148, 66, [
          [0, '#ffab4e76'], [0.55, '#e9964139'], [1, '#e8872800']
        ], -0.06);
        blot(ctx, 522, 550, 277, 54, [
          [0, '#ef8a2c47'], [0.68, '#d16c242d'], [1, '#d16c2400']
        ], 0.033);
        blot(ctx, 843, 479, 84, 54, [
          [0, '#f096483f'], [0.64, '#d0753030'], [1, '#d0753000']
        ], -0.18);
        blot(ctx, 440, 532, 153, 31, [
          [0, '#ffd8874c'], [0.35, '#ffc26f27'], [1, '#ec9e4700']
        ], 0.21);

        const rng = random(210299);
        for (let i = 0; i < 460; i++) {
          const angle = rng() * tau;
          const distance = Math.sqrt(rng()) * 0.986;
          const x = 550 + Math.cos(angle) * 368 * distance;
          const y = 437 + Math.sin(angle) * 132 * distance;
          const size = 0.65 + Math.pow(rng(), 3.35) * 21;
          const height = size * mix(0.25, 0.55, rng()) + 0.23;
          const shade = rng();
          const lit = clamp(1.16 - (x - 190) / 1040 + (y - 425) / 268);
          const outline = thrownEdge(x, y, size, height);
          fill(ctx, outline, linear(ctx, x - size * 0.38, y - height, x + size * 0.2, y + height, [
            [0, shade > 0.53 ? '#e388323e' : '#85311b4a'],
            [0.47, shade > 0.53 ? '#b7502040' : '#a7381638'],
            [1, shade > 0.53 ? '#6828135c' : '#ce682c4c']
          ]));
          if (size > 1.5) stroke(ctx, outline, 'rgba(98,35,15,' + lit * 0.3 + ')', 0.7);
          const gleam = new Path2D();
          gleam.ellipse(x, y, size * 0.84, height * 0.86, -0.025, 3.47, mix(4.26, 5.51, rng()));
          stroke(ctx, gleam, 'rgba(255,192,106,' + lit * mix(0.18, 0.49, rng()) + ')',
            mix(0.38, 0.91, rng()));
        }
        for (let i = 0; i < 61; i++) {
          const x = mix(191, 898, rng());
          const y = mix(435, 566, rng());
          const length = mix(1.8, 14.2, rng() ** 2.2);
          const slope = (550 - x) * 0.00115;
          const glint = curve([[x, y], [x + length * 0.46, y + length * slope * 0.7 - 0.45],
            [x + length, y + length * slope]]);
          stroke(ctx, glint, linear(ctx, x, y, x + length, y, [
            [0, '#ffe2a700'], [0.37, '#ffe5b366'], [0.8, '#ffcc8052'], [1, '#ffcc8000']
          ]), mix(0.32, 0.97, rng()));
        }

        for (let i = 0; i < 1350; i++) {
          const x = mix(178, 920, rng());
          const y = mix(317, 569, rng());
          const coarse = rng() ** 5;
          ctx.fillStyle = rng() < 0.64 ? '#42190c45' : '#ffc5753b';
          ctx.fillRect(x, y, 0.45 + coarse * 2.95, 0.36 + coarse * 1.4);
        }
        stroke(ctx, thrownEdge(550, 438, 367, 130, 0.1, 3.12),
          linear(ctx, 197, 477, 899, 491, [
            [0, '#ffad6065'], [0.24, '#ffd38a77'], [0.49, '#ffa6543d'], [1, '#d671353e']
          ]), 2.15);
        stroke(ctx, thrownEdge(550, 438, 365, 128, 3.02, 6.3), '#3e1b135e', 2.9);
        ctx.restore();
      }

      const noodlePalette = [
        ['#965223', '#d28b43', '#f3bb72', '#ffe2a3'],
        ['#7c421d', '#bf7a3a', '#e4a55b', '#fad694'],
        ['#a25c29', '#d59249', '#efb365', '#ffe1a1'],
        ['#8e4b25', '#c58240', '#e6a759', '#ffdc95'],
        ['#a36638', '#d7a063', '#f3c687', '#ffe5ac']
      ];

      function noodle(ctx, points, width, colors, light, glint) {
        const path = curve(points);
        let top = points[0][1];
        let bottom = top;
        for (const [, y] of points) {
          top = Math.min(top, y);
          bottom = Math.max(bottom, y);
        }
        ctx.save();
        ctx.globalAlpha = light * 0.63;
        ctx.translate(0.4, 1.8);

            const dx = Math.cos(a) * r + warp * (4 + radius * 0.09);
            const dy = Math.sin(a) * r * flatness + Math.cos(a * 2.3 + phase) * 4.5;
            points.push([x + dx * Math.cos(roll) - dy * Math.sin(roll) + drift * (u - 0.5),

            width: mix(4.3, 9.3, rng()),

            glint: mix(0.29, 0.72, rng())

        for (let i = 0; i < 12; i++) {
          const a = i / 12 * tau;
          const ripple = 1 + 0.1 * Math.sin(a * 3 + phase) + 0.06 * Math.cos(a * 5 + 1);
          edge.push([Math.cos(a) * size * ripple, Math.sin(a) * ellipse * ripple]);
          inside.push([Math.cos(a) * size * (ripple - 0.26) - 0.35, Math.sin(a) * ellipse * (ripple - 0.37) - 0.3]);
        }
        const exterior = curve(edge, true);
        const interior = curve(inside, true);
        const ring = new Path2D(exterior);
        ring.addPath(interior);
        ctx.translate(0.9, 1.75);
        fill(ctx, exterior, chili ? '#2f150dd2' : '#2b280f90');
        ctx.translate(-0.9, -0.45);
        ctx.fillStyle = chili ? '#842d1c' : '#3b581d';
        ctx.fill(ring, 'evenodd');
        ctx.translate(0, -1.3);
        ctx.fillStyle = linear(ctx, -size * 0.45, -ellipse, size * 0.4, ellipse,
          chili
            ? [[0, '#f5a250'], [0.26, '#cd4b2a'], [0.69, '#ad3720'], [1, '#e36738']]
            : [[0, '#d0d785'], [0.34, '#9fb753'], [0.67, '#6c882f'], [1, '#96a747']]);
        ctx.fill(ring, 'evenodd');
        stroke(ctx, interior, chili ? '#e7733a9c' : '#d6df9894', 0.64);
        stroke(ctx, exterior, chili ? '#ea8e4253' : '#cbda8455', 0.52);
        if (chili && size > 6) {
          const direction = rng() > 0.55 ? -1 : 1;
          const seed = oval(direction * size * 0.29, 1, size * 0.16, size * 0.09, 0.25);
          fill(ctx, seed, '#ffd083');
        }
        ctx.restore();
      }

      function garnish(ctx) {
        const rng = random(52990);
        const clusters = [
          [553, 388, 67, 19, 15], [523, 454, 85, 31, 15], [436, 503, 57, 27, 12],
          [618, 454, 54, 27, 8], [677, 526, 65, 22, 11], [259, 444, 30, 25, 8],
          [842, 456, 31, 41, 5]
        ];
        for (const [x, y, rx, ry, count] of clusters) {
          for (let i = 0; i < count; i++) {
            const a = rng() * tau;
            const radius = Math.sqrt(rng());
            const cx = x + Math.cos(a) * radius * rx;
            const cy = y + Math.sin(a) * radius * ry;
            const size = mix(2.25, 9.65, rng() ** 2.05);
            if (i % 5 !== 0 || size > 5.4) {
              crossSection(ctx, cx, cy, size, mix(-0.95, 0.95, rng()), false, rng);
            } else {
              const angle = rng() * tau;
              const points = [[cx, cy], [cx + Math.cos(angle) * size * 1.6, cy + Math.sin(angle) * size * 1.3],
                [cx + Math.cos(angle + 0.3) * size * 2.75, cy + Math.sin(angle + 0.3) * size * 2]];
              const piece = curve(points);
              stroke(ctx, piece, '#3d4923', size * 0.8);
              stroke(ctx, piece, '#829b4d', size * 0.49);
            }
          }
        }

        for (const [x, y, size, angle] of [
          [264, 473, 13, 0.24], [280, 490, 7.6, -0.32], [416, 526, 10, 0.29],
          [572, 411, 9.4, 0.34], [593, 417, 5.6, -0.76], [497, 475, 8.3, -0.32],
          [676, 489, 11.6, -0.41], [691, 500, 6.7, 0.22], [607, 539, 11.5, 0.02],
          [861, 460, 6.3, -0.12], [526, 355, 6.8, 0.15]
        ]) {
          crossSection(ctx, x, y, size, angle, true, rng);
        }

        for (let i = 0; i < 232; i++) {
          const a = rng() * tau;
          const r = Math.sqrt(rng());
          const x = 532 + Math.cos(a) * r * 316;
          const y = 443 + Math.sin(a) * r * 102;
          const rotation = rng() * tau;
          const size = mix(0.62, 2.75, rng() ** 1.4);
          const black = rng() < 0.35;
          fill(ctx, oval(x + 0.5, y + 0.7, size * 1.06, size * 0.52, rotation), '#3b200f70');
          fill(ctx, oval(x, y, size, size * 0.51, rotation), black ? '#33271e' : '#e7c78b');
          if (size > 1.54) {
            fill(ctx, oval(x - 0.24, y - 0.35, size * 0.51, size * 0.19, rotation),
              black ? '#c2a0736e' : '#fff0beaf');
          }
        }
      }

      function paintToppings(ctx) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.save();
        ctx.clip(innerLip);
        nori(ctx);
        mushroom(ctx, 295, 395, 0.94, -0.33, 145);
        mushroom(ctx, 373, 358, 1.03, 0.098, 323);
        mushroom(ctx, 435, 380, 0.76, 0.35, 638);
        paintNoodles(ctx);
        tofu(ctx, 366, 404, 1.02, -0.12, 10344);
        tofu(ctx, 321, 471, 0.89, 0.094, 7323);
        tofu(ctx, 648, 477, 0.76, -0.19, 18734);
        mushroom(ctx, 745, 512, 0.72, 0.21, 241);
        blot(ctx, 779, 481, 118, 62, [[0, '#2c200ac7'], [0.61, '#291e0859'], [1, '#24160800']], -0.32);
        bokChoy(ctx, [784, 510], [851, 448], [873, 353], 35, greens[0], 437);
        bokChoy(ctx, [779, 513], [746, 428], [790, 330], 47, greens[1], 119);
        bokChoy(ctx, [780, 504], [847, 484], [889, 398], 36, greens[2], 256);
        bokChoy(ctx, [768, 513], [714, 463], [697, 374], 35, greens[3], 839);
        bokChoy(ctx, [778, 515], [777, 444], [824, 397], 27, greens[1], 593);
        garnish(ctx);
        ctx.restore();
      }

      const shimmer = [
        [237, 465, 20, 5.5, 0.7], [281, 501, 22, 8.2, 2.6], [568, 552, 22, 4.3, 3.8],
        [707, 548, 24, 5, 4.6], [845, 479, 14, 5.4, 1.7], [883, 451, 17, 5.2, 2.2]
      ];

      function paintReflections(ctx, time, mouseX, mouseY) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.restore();
        ctx.save();
        ctx.clip(soup);
        blot(ctx, 301 + mouseX * 48, 488 + mouseY * 21, 165, 37, [
          [0, '#ffd28b38'], [0.45, '#ffc47816'], [1, '#ffc47800']
        ], 0.24);
        blot(ctx, 708 + mouseX * 49, 540 + mouseY * 15, 183, 27, [
          [0, '#ffd0991e'], [0.61, '#fabc6b16'], [1, '#fabc6b00']
        ], -0.16);

        for (const [x, y, width, height, phase] of shimmer) {
          const glint = new Path2D();
          const pulse = 0.5 + 0.5 * Math.sin(time * 1.25 + phase);
          const sway = Math.sin(time * 0.72 + phase) * 2.2;
          const size = 0.93 + pulse * 0.17;
          const cx = x + sway + mouseX * 9;
          const cy = y + mouseY * 4;
          glint.ellipse(cx, cy, width * size, height, -0.09, 3.63, 5.51 - pulse * 0.69);
          stroke(ctx, glint, linear(ctx, cx - width, cy, cx + width, cy, [
            [0, '#ffe2a900'],
            [0.36, 'rgba(255,223,164,' + mix(0.09, 0.30, pulse) + ')'],
            [0.72, '#ffc8891a'], [1, '#ffc88900']
          ]), mix(0.72, 1.45, pulse));
        }
        ctx.restore();
      }

      const vaporStreams = [
        { x: 0.365, start: 0.041, end: 0.73, phase: 3.8, sway: 0.12, drift: -0.128, width: 0.052, weight: 0.45, speed: 0.102 },
        { x: 0.465, start: 0.035, end: 0.92, phase: 1.2, sway: 0.182, drift: 0.055, width: 0.062, weight: 0.58, speed: 0.086 },
        { x: 0.545, start: 0.058, end: 0.84, phase: 5.7, sway: 0.14, drift: -0.027, width: 0.057, weight: 0.51, speed: 0.083 },
        { x: 0.638, start: 0.068, end: 0.71, phase: 2.5, sway: 0.116, drift: 0.087, width: 0.055, weight: 0.37, speed: 0.108 }
      ];
      const steamContext = steam.getContext('2d');
      let steamImage;
      let mist;

      function paintSteam(time, mouseX, mouseY) {
        const { width, height, data } = steamImage;
        mist.fill(0);
        for (const stream of vaporStreams) {
          const { start, end, phase, speed } = stream;
          const y0 = Math.floor(height * (1 - end));
          const y1 = Math.min(height, Math.ceil(height * (1 - start)));
          for (let y = y0; y < y1; y++) {
            const rise = 1 - (y + 0.5) / height;
            const age = rise - time * speed;
            const scroll = age + phase * 2.55;
            const tilt = Math.max(0, rise - start) ** 1.17;
            const life = smooth(start, start + 0.19, rise) * (1 - smooth(end - 0.24, end, rise));
            const turn = Math.sin(6.3 * age + phase) * 0.72
              + Math.sin(15.8 * age + phase * 1.61) * 0.33
              + (noise(3.7 * age, phase) - 0.5) * 0.49;
            const center = stream.x + tilt * (turn * stream.sway * 2.08 + stream.drift)
              + 0.16 * mouseX * rise ** 1.36;
            const widthAtHeight = (0.008 + stream.width * rise ** 1.16) *
              (0.85 + 0.29 * noise(age * 7.3, phase + 18));
            const strength = stream.weight * life * (1 + mouseY * rise * 0.12);
            const foldStrength = 1.5 + rise * 3.4;
            const search = widthAtHeight * 4.15;
            const x0 = Math.max(0, Math.floor((center - search) * width));
            const x1 = Math.min(width, Math.ceil((center + search) * width));
            const twist = 0.5 + Math.sin(22 * age + phase * 2) * 0.21;
            for (let x = x0; x < x1; x++) {
              const p = (x + 0.5) / width;
              const u = (p - center) / widthAtHeight;
              const billow = noise(21 * (p - center * 0.25) + phase * 9, scroll * 9.75);
              const threads = noise(53 * p + 4.2 * billow + phase, scroll * 22.5);
              const curl = u + (billow - 0.5) * foldStrength + (threads - 0.5) * 0.68;
              const plume = Math.exp(-u * u * 0.58);
              const ribbon = Math.exp(-((curl - twist) ** 2) * 4.0);
              const edge = Math.exp(-((curl + 0.73) ** 2) * 8.0);
              const fold = (0.24 + 0.76 * smooth(0.22, 0.78, threads * 0.53 + billow * 0.47));
              const density = plume * (0.12 * billow + fold * (ribbon * 0.81 + edge * 0.48));
              mist[y * width + x] += density * strength;
            }
          }
        }

        for (let y = 0; y < height; y++) {
          const rise = 1 - y / height;
          const warmth = 1 - smooth(0.14, 0.73, rise);
          const red = mix(197, 242, warmth);
          const green = mix(187, 204, warmth);
          const blue = mix(181, 162, warmth);
          for (let x = 0; x < width; x++) {
            const i = y * width + x;
            const offset = i * 4;
            data[offset] = red;
            data[offset + 1] = green;
            data[offset + 2] = blue;
            data[offset + 3] = 255 * (1 - Math.exp(-mist[i] * 1.35));
          }
        }
        steamContext.putImageData(steamImage, 0, 0);
      }

      const reflectionContext = reflections.getContext('2d');
      let artDensity = 0;
      let scale = 1;
      let centerX = 0;
      let centerY = 0;
      let targetX = 0;
      let targetY = 0;
      let pointerX = 0;
      let pointerY = 0;
      let frame = 0;
      let resizeFrame = 0;
      let previousTime = 0;
      let lastPaint = 0;
      let time = 3.1;

      function prepareArt(canvas, context, density) {
        canvas.width = Math.ceil(art.width * density);
        canvas.height = Math.ceil(art.height * density);
        context.setTransform(canvas.width / art.width, 0, 0, canvas.height / art.height,
          -art.x * canvas.width / art.width, -art.y * canvas.height / art.height);
      }

      function place(element, x, y, width, height) {
        element.style.left = x + 'px';
        element.style.top = y + 'px';
        element.style.width = width + 'px';
        element.style.height = height + 'px';
      }

      function paintMotion() {
        const offsetX = pointerX * 4.6 * Math.min(scale, 1.45);
        const offsetY = pointerY * 3.1 * Math.min(scale, 1.45);
        const translation = 'translate3d(' + offsetX + 'px,' + offsetY + 'px,0)';
        dish.style.transform = translation;
        steam.style.transform = translation;
        paintReflections(reflectionContext, time, pointerX, pointerY);
        paintSteam(time, pointerX, pointerY);
      }

      function resize() {
        resizeFrame = 0;
        const width = scene.clientWidth;
        const height = scene.clientHeight;
        if (!width || !height) return;
        const landscape = smooth(0.72, 1.42, width / height);
        scale = Math.min(width / mix(866, 914, landscape), height / 775);
        centerX = width * 0.5;
        centerY = height * mix(0.572, 0.549, landscape);

        place(dish, centerX + (art.x - origin.x) * scale, centerY + (art.y - origin.y) * scale,
          art.width * scale, art.height * scale);
        const heightOfSteam = vapor.height * scale * mix(1.44, 1, landscape);
        place(steam, centerX + (vapor.x - origin.x) * scale,
          centerY + (vapor.bottom - origin.y) * scale - heightOfSteam, vapor.width * scale, heightOfSteam);

        const density = Math.round(clamp(scale * (window.devicePixelRatio || 1) * 1.25, 0.76, 2.15) * 20) / 20;
        if (density !== artDensity) {
          artDensity = density;
          const pottery = ceramic.getContext('2d');
          const food = toppings.getContext('2d');
          prepareArt(ceramic, pottery, density);
          prepareArt(toppings, food, density);
          prepareArt(reflections, reflectionContext, Math.min(density, 1.35));
          paintCeramic(pottery);
          paintBroth(pottery);
          paintToppings(food);
        }

        const steamWidth = Math.round(clamp(vapor.width * scale * 0.49, 212, 450));
        const steamHeight = Math.max(166, Math.round(steamWidth * 0.68));
        if (!steamImage || steam.width !== steamWidth || steam.height !== steamHeight) {
          steam.width = steamWidth;
          steam.height = steamHeight;
          steamImage = steamContext.createImageData(steamWidth, steamHeight);
          mist = new Float32Array(steamWidth * steamHeight);
        }
        paintTable(width, height, scale, centerX, centerY);
        paintMotion();
      }

      function animate(timestamp) {
        frame = 0;
        if (motion.matches || document.hidden) return;
        const delta = previousTime ? Math.min((timestamp - previousTime) / 1000, 0.05) : 0;
        previousTime = timestamp;
        time += delta;
        const ease = 1 - Math.exp(-delta * 4.1);
        pointerX = mix(pointerX, targetX, ease);
        pointerY = mix(pointerY, targetY, ease);
        if (timestamp - lastPaint >= 28 && steamImage) {
          paintMotion();
          lastPaint = timestamp;
        }
        frame = requestAnimationFrame(animate);
      }

      function resetPointer() {
        targetX = 0;
        targetY = 0;
      }

      function syncMotion() {
        cancelAnimationFrame(frame);
        frame = 0;
        previousTime = 0;
        lastPaint = 0;
        if (motion.matches) {
          resetPointer();
          pointerX = 0;
          pointerY = 0;
          if (steamImage) paintMotion();
        } else if (!document.hidden) {
          frame = requestAnimationFrame(animate);
        }
      }

      scene.addEventListener('pointermove', (event) => {
        if (motion.matches || event.pointerType === 'touch' || !centerX || !centerY) return;
        targetX = clamp((event.clientX - centerX) / centerX, -1, 1);
        targetY = clamp((event.clientY - centerY) / centerY, -1, 1);
      }, { passive: true });
      scene.addEventListener('pointerleave', resetPointer);
      window.addEventListener('blur', resetPointer);
      window.addEventListener('resize', () => {
        if (!resizeFrame) resizeFrame = requestAnimationFrame(resize);
      }, { passive: true });
      document.addEventListener('visibilitychange', syncMotion);
      motion.addEventListener('change', syncMotion);
      resize();
      syncMotion();
    })();
  </script>
</body>
</html>
