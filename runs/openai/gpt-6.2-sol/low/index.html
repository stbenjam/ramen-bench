<script>
const ns = 'http://www.w3.org/2000/svg';
let seed = 41724;
function random() {
  seed = (1664525 * seed + 1013904223) >>> 0;
  return seed / 4294967296;
}
function shape(parent, tag, attributes) {
  const node = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  parent.append(node);
  return node;
}
const group = id => document.getElementById(id);
for (let i = 0; i < 430; i++) {
  shape(group('grit'), 'circle', {cx:random()*71,cy:random()*67,r:.15+random()*.65,
    fill:random()<.52?'#ffc899':'#090807',opacity:.08+random()*.28});
}
for (let i = 0; i < 39; i++) {
  const y = 469 + i * 4.8;
  shape(group('throwLines'), 'path', {d:`M192 ${y}Q500 ${y+135-i*1.22} 808 ${y-5}`,
    fill:'none',stroke:i%3?'#b78a73':'#09080a','stroke-width':.45+random()*1.75,opacity:.035+random()*.10});
}
for (let i = 0; i < 410; i++) {
  const angle = random()*Math.PI*2, distance = Math.sqrt(random());
  const x = 500+284*Math.cos(angle)*distance, y = 448+87*Math.sin(angle)*distance;
  const radius = .5+random()**3*6.6;
  shape(group('oil'),'ellipse',{cx:x,cy:y,rx:radius,ry:radius*.39,fill:i%5?'#e69b4b':'#f6c982',
    'fill-opacity':.09+random()*.39,stroke:i%4?'#be5925':'#ffc277','stroke-width':.55,opacity:.45+random()*.5});
}
for (let i = 0; i < 98; i++) {
  const x = 342+random()*204, y = 390+random()*122;
  const length = 19+random()*95, height = 5+random()*13;
  const d = `M${x} ${y}c${length*.30} ${-height*1.7} ${length*.58} ${height*1.3} ${length*.27} ${height*1.02}s${-length*.18} ${-height*1.55} ${length*.24} ${-height*.67}s${length*.23} ${height*.78} ${length*.49} ${-height*.43}`;
  const noodle = shape(group('noodles'),'g',{fill:'none','stroke-linecap':'round',opacity:.55+random()*.45});
  shape(noodle,'path',{d,stroke:'#632c16','stroke-width':5.8,transform:'translate(0 1.3)'});
  shape(noodle,'path',{d,stroke:['#e7aa56','#eabc72','#ca873e','#f0c67e','#d39a50'][i%5],'stroke-width':3.7});
  shape(noodle,'path',{d,stroke:'#ffe1a1','stroke-width':.85,opacity:.72,transform:'translate(0 -.75)'});
}
for (let i = 0; i < 660; i++) {
  const x = 493+random()*160, y = 270+random()*157;
  shape(group('nori'),'path',{d:`M${x} ${y}l${random()*5} ${-random()*3} ${random()*3} ${random()*3}`,
    fill:'none',stroke:i%3?'#a4ab6c':'#0b0f0b',opacity:.07+random()*.28,'stroke-width':.3+random()*1.4});
}
for (let i = 0; i < 145; i++) {
  const x = 300+random()*426, y = 393+random()*132;
  if (((x-500)/239)**2+((y-453)/77)**2>1) continue;
  const scale = .55+random()*.95;
  const topping = shape(group('garnish'),'g',{transform:`translate(${x} ${y}) rotate(${random()*180}) scale(${scale})`});
  if (i%5===0) {
    shape(topping,'ellipse',{rx:5,ry:2.7,fill:'#263e20',stroke:'#7ead48','stroke-width':1.8});
    shape(topping,'path',{d:'M-4 1Q0 4 4 1',fill:'none',stroke:'#b1c971','stroke-width':.7});
  } else if(i%5===1) {
    shape(topping,'path',{d:'M-4 1Q-1-3 4-1Q2 3-4 1Z',fill:'#af422b',stroke:'#d67047','stroke-width':.6});
  } else {
    shape(topping,'ellipse',{rx:2.05,ry:.85,fill:i%3?'#eed398':'#382921',opacity:.9});
  }
}
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let pointer = 0, breeze = 0, frame = 0;
function steam(time) {
  const t = motion.matches ? 1.8 : time / 1000;
  if (!motion.matches) breeze += (pointer - breeze) * .037;
  context.setTransform(canvas.width/1000,0,0,canvas.height/760,0,0);
  context.clearRect(0,0,1000,760);
  context.globalCompositeOperation = 'screen';
  context.lineCap = 'round';
  for (let plume = 0; plume < 5; plume++) {
    const origin = [361,438,504,564,665][plume];
    const foot = [442,466,431,432,447][plume];
    const rise = [194,267,308,232,202][plume];
    for (let strand = 0; strand < 26; strand++) {
      const offset = (strand-12.5)/12.5;
      const gradient = context.createLinearGradient(0,foot,0,foot-rise);
      const strength = (1 - Math.abs(offset)*.65) * (.82+.18*Math.sin(t*.42+plume));
      gradient.addColorStop(0,'rgba(235,190,144,0)');
      gradient.addColorStop(.19,`rgba(225,192,159,${.032*strength})`);
      gradient.addColorStop(.42,`rgba(212,189,170,${.055*strength})`);
      gradient.addColorStop(.7,`rgba(197,183,172,${.025*strength})`);
      gradient.addColorStop(1,'rgba(185,175,169,0)');
      context.strokeStyle = gradient;
      context.lineWidth = 3+Math.abs(offset)*4;
      context.beginPath();
      for (let step = 0; step <= 44; step++) {
        const u = step/44;
        const phase = plume * 1.83 + t*.54;
        const x = origin + u*(24*Math.sin(u*8-phase)+29*Math.sin(u*4+phase*.7))
          + offset*(8+34*u) + (motion.matches ? 0 : breeze)*u*u
          + 8*u*Math.sin(u*10+offset*3+phase);
        const y = foot - u*rise + 10*u*Math.sin(phase+offset*2);
        if (step === 0) context.moveTo(x,y);
        else context.lineTo(x,y);
      }
      context.stroke();
    }
  }
}
function animate(time) {
  steam(time);
  frame = requestAnimationFrame(animate);
}
function updateMotion() {
  cancelAnimationFrame(frame);
  if (motion.matches) steam(0);
  else frame = requestAnimationFrame(animate);
}
function resize() {
  const bounds = canvas.getBoundingClientRect();
  const density = Math.min(devicePixelRatio || 1,2);
  canvas.width = Math.max(1,Math.round(bounds.width*density));
  canvas.height = Math.max(1,Math.round(bounds.height*density));
  if (motion.matches) steam(0);
}
window.addEventListener('resize',resize);
motion.addEventListener('change',updateMotion);
window.addEventListener('pointermove',event => {
  if (event.pointerType !== 'mouse' || motion.matches) return;
  pointer = (event.clientX / innerWidth - .5) * 184;
},{passive:true});
document.documentElement.addEventListener('pointerleave',() => {pointer = 0;});
window.addEventListener('blur',() => {pointer = 0;});
resize();
updateMotion();
</script>
