      position: relative;
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 40% 62%, rgba(100, 57, 31, .25), transparent 49%),
        radial-gradient(ellipse at 50% 52%, #352a22 0%, #24211e 33%, #1b1c1a 60%, #111515 100%);
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 51% 34%, rgba(159, 109, 62, .055), transparent 48%);
      pointer-events: none;
    }
    #scene, #vapor-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(125vw, 134vh);
      width: min(125vw, 134svh);
      height: auto;
      overflow: visible;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #vapor-layer { will-change: transform; }
    #grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .20;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    .glimmer { animation: glimmer 7s ease-in-out infinite alternate; }
    .glimmer.late { animation-delay: -4s; animation-duration: 9s; }
    @keyframes glimmer { from { opacity: .40; } to { opacity: .86; } }
    @media (prefers-reduced-motion: reduce) {
      .glimmer { animation: none; opacity: .65; }
    }
  </style>
</head>

<script>
(() => {
  "use strict";
  const ns = "http://www.w3.org/2000/svg";
  const id = name => document.getElementById(name);
  const scene = id("scene");
  const tau = Math.PI * 2;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const round = value => Math.round(value * 100) / 100;
  const coord = point => point.map(round).join(" ");
  const line = points => points.length ? "M" + points.map(coord).join("L") : "";
  const curve = points => {
    if (!points.length) return "";
    let d = "M" + coord(points[0]);
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[Math.max(0, i - 1)], b = points[i];
      const c = points[i + 1], e = points[Math.min(points.length - 1, i + 2)];
      d += "C" + coord([b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6]) + " ";
      d += coord([c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6]) + " " + coord(c);
    }
    return d;
  };
  function add(tag, attributes, parent) {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    parent.appendChild(node);
    return node;
  }
  function path(parent, d, attributes = {}) {
    return add("path", { d, ...attributes }, parent);
  }
  function use(parent, name, transform, attributes = {}) {
    return add("use", { href: "#" + name, transform, ...attributes }, parent);
  }
  function ellipse(parent, x, y, rx, ry, attributes) {
    return add("ellipse", { cx: round(x), cy: round(y), rx: round(rx), ry: round(ry), ...attributes }, parent);
  }
  function pose(x, y, angle, sx, sy = sx) {
    return "translate(" + round(x) + " " + round(y) + ") rotate(" + round(angle) + ") scale(" + round(sx) + " " + round(sy) + ")";
  }

  // The print grain and the ingredients keep the same arrangement on every visit.
  let seed = 0x5939c2e1;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const between = (lo, hi) => lo + random() * (hi - lo);
  const choose = array => array[Math.floor(random() * array.length)];
  function fleck(x, y, w, h, lean = 0) {
    const outline = [[-.50,.02],[-.28,-.44],[.14,-.53],[.52,-.18],[.36,.29],[-.14,.49]];
    return line(outline.map(([u, v]) => [x + u * w + v * lean, y + v * h + between(-.09,.09) * h])) + "Z";
  }

  function drawSurroundings() {
    const floor = id("table-grain");
    const lights = [], darks = [];
    for (let i = 0; i < 430; i++) {
      const a = between(0, tau), r = Math.sqrt(random());
      const x = 488 + Math.cos(a) * r * 494, y = 673 + Math.sin(a) * r * 64;
      const width = between(1.4, 24) * (1.12 - r * .62);
      const dy = between(-.58,.32);
      (i % 3 ? darks : lights).push("M" + coord([x,y]) + "q" + coord([width * .43,dy-.24]) + " " + coord([width,dy]));
    }
    path(floor, lights.join(""), { fill: "none", stroke: "#bd8d61", "stroke-width": ".58", opacity: ".20" });
    path(floor, darks.join(""), { fill: "none", stroke: "#140e0b", "stroke-width": ".72", opacity: ".29" });
    const air = id("air-dust");
    for (let i = 0; i < 42; i++) {
      const x = between(91, 918), y = between(92, 595), r = between(.42, 1.35);
      ellipse(air, x, y, r, r * between(.68,1.2), { fill: choose(["#c89e6b","#bfa17f","#c28c51"]), opacity: round(between(.12,.46)) });
    }
  }

  // Project the painted arcs onto the same curved wall that defines the silhouette.
  const tilt = 134 / 350;
  const radius = v => 350 - 22 * v - 209 * v * v;
  const edge = v => Math.acos(tilt * (22 + 418 * v) / 219);
  function porcelain(angle, v) {
    const r = radius(v);
    return [500 + Math.sin(angle) * r, 401 + v * 219 + Math.cos(angle) * r * tilt];
  }
  function parallel(v, from = -edge(v), to = edge(v)) {
    return Array.from({length: 100}, (_, i) => porcelain(from + (to - from) * i / 99, v));
  }
  function drawVessel() {
    const left = [], right = [];
    for (let i = 0; i <= 64; i++) {
      const v = i / 64;
      left.push(porcelain(-edge(v), v));
      right.unshift(porcelain(edge(v), v));
    }
    id("vessel-form").setAttribute("d", line([[150,401], ...left, ...parallel(1), ...right, [850,401]]) + "Z");
    const bands = id("ceramic-paint");
    const bandStart = .17, bandEnd = .697;
    const bandSides = Array.from({length:32}, (_,i) => bandStart + (bandEnd-bandStart)*i/31);
    const band = line([...parallel(bandStart), ...bandSides.map(v=>porcelain(edge(v),v)),
      ...parallel(bandEnd).reverse(), ...bandSides.reverse().map(v=>porcelain(-edge(v),v))]) + "Z";
    id("band-boundary").setAttribute("d", band);
    path(bands, band, {fill: "#632e2b", opacity: ".18"});
    const waves = add("g", {"clip-path": "url(#band-clip)", fill:"none", stroke:"url(#wave-ink)"}, bands);
    const uv = (x, y) => porcelain(x / 310, bandStart + (bandEnd - bandStart) * y / 79);
    const fullRadius = 38, rise = .79, spacing = 19.5;
    const arcs = [[], [], []];
    for (let row = 0; row < 7; row++) {
      const cy = row * spacing - 6;
      for (let col = -8; col <= 8; col++) {
        const cx = (col * 2 + (row % 2)) * fullRadius;
        for (const [ring, r] of [5.3,11.9,18.5,25.1,31.6,37.7].entries()) {
          let points = [];
          for (let j = 0; j <= 66; j++) {
            const angle = j / 66 * Math.PI;
            const x = cx + r * Math.cos(angle), y = cy - r * rise * Math.sin(angle);
            const v = bandStart + (bandEnd - bandStart) * y / 79;
            const dx = (Math.abs(x - cx) - fullRadius) / fullRadius;
            const dy = (y - cy - spacing) / (fullRadius * rise);
            const visible = y >= -.5 && y <= 79.5 && Math.abs(x / 310) <= edge(clamp(v,0,1)) && dx * dx + dy * dy > 1.008;
            if (visible) {
              points.push(uv(x, y));
            } else if (points.length) {
              arcs[ring % 3].push(line(points));
              points = [];
            }
          }
          if (points.length) arcs[ring % 3].push(line(points));
        }
      }
    }
    arcs.forEach((segments, i) => path(waves, segments.join(""), {"stroke-width": [1.35,1.42,1.53][i], opacity: ".87"}));
    for (const [v, w, opacity] of [[.050,2.6,.88],[.077,.95,.76],[.135,1.0,.67],[.158,1.9,.93],[.710,2.0,.92],[.741,1.0,.75],[.906,1.0,.49]]) {
      path(bands, line(parallel(v)), {fill:"none", stroke:"url(#wave-ink)", "stroke-width":w, opacity});
    }
    const glaze = id("glaze-marks");
    for (const [angle, width, from, to, opacity] of [[-.77,.18,.04,.94,.085],[-.98,.05,.10,.64,.10],[-.5,.13,.05,.99,.045],[.69,.30,.09,.97,.07]]) {
      const sideA = [], sideB = [];
      for (let j = 0; j <= 24; j++) {
        const v = from + (to - from) * j / 24;
        const w = width * Math.pow(Math.sin(Math.PI * j / 24), .7);
        sideA.push(porcelain(angle - w, v));
        sideB.unshift(porcelain(angle + w, v));
      }
      path(glaze, line([...sideA,...sideB]) + "Z", {fill: angle > 0 ? "#492325" : "#edb580", opacity});
    }
    const texture = [[],[],[],[]];
    for (let i = 0; i < 1840; i++) {
      const v = random(), limit = edge(v);
      const [x,y] = porcelain(between(-limit,limit),v);
      texture[i % 4].push(fleck(x,y,between(.45,2.1),between(.35,1.25),.24));
    }
    ["#efbf8e","#602d29","#f3cb8d","#53282a"].forEach((fill,i) => {
      path(id("pot-grain"),texture[i].join(""),{fill,opacity:[.36,.39,.20,.24][i]});
    });
    for (let i = 0; i < 48; i++) {
      const v = between(.8,.98), a = between(-edge(v),-.26);
      path(id("pot-grain"), line(parallel(v,a,a+between(.01,.09))), {stroke:"#f0b180", "stroke-width":between(.35,.75), fill:"none", opacity:between(.17,.43)});
    }
  }

  function drawNori() {
    const corner = [[0,0],[142,-1],[151,103],[-6,106]], outline = [];
    corner.forEach(([x,y], i) => {
      const [ex,ey] = corner[(i+1)%4];
      const length = Math.hypot(ex-x,ey-y), steps = Math.ceil(length/3.3);
      for (let j = 0; j < steps; j++) {
        const t = j/steps, wobble = between(-1.35,1.35) + Math.sin(t*17 + i)*.72;
        outline.push([x+(ex-x)*t-(ey-y)/length*wobble, y+(ey-y)*t+(ex-x)/length*wobble]);
      }
    });
    id("nori-shape").setAttribute("d",line(outline)+"Z");
    const fibres = id("nori-fibres");
    for(let i=0;i<24;i++) {
      const x=between(-4,145),y=between(-9,89),w=between(3,12),h=between(17,41);
      const ridge=[[x,y],[x+w*.2,y+h*.23],[x+w*.7,y+h*.36],[x+w*.46,y+h*.61],[x+w,y+h]];
      path(fibres,line([...ridge,[x+w*.15,y+h*.59],[x+w*.24,y+h*.37]])+"Z",{fill:i%3?"#8b9880":"#142e26",opacity:between(.12,.24)});
      path(fibres,line(ridge),{fill:"none",stroke:"#99a28b","stroke-width":.7,opacity:.37});
    }
    for (let i=0; i<44; i++) {
      const x=between(-8,150), y=between(-3,106);
      path(fibres,fleck(x,y,between(5,22),between(2,8),between(-5,8)),{fill:choose(["#789079","#596b52","#162c28","#243a32"]),opacity:between(.18,.43)});
    }
    const marks = [[],[],[],[],[]];
    for (let i=0; i<1550; i++) {
      const x=between(-8,153), y=between(-3,109), w=between(.2,4.0), h=between(-1.6,.7);
      marks[i%5].push("M"+coord([x,y])+"l"+coord([w*.42,h-.28])+" "+coord([w*.58,h*.48]));
    }
    ["#b6b88c","#72856a","#192c25","#a8aa7e","#87947b"].forEach((stroke,i) => {
      path(fibres, marks[i].join(""), {fill:"none", stroke, "stroke-width":i===2?1.15:.72, opacity:[.51,.66,.76,.4,.62][i]});
    });
    path(fibres,line(outline.slice(0,45)),{fill:"none",stroke:"#9caa83","stroke-width":2,opacity:.69});
    const creases=[];
    for(let i=0;i<29;i++) {
      const x=between(0,148), y=between(1,102);
      creases.push(curve([[x,y],[x+4,y-1.8],[x+7,y-1.2],[x+between(9,15),y-3.6]]));
    }
    path(fibres,creases.join(""),{fill:"none",stroke:"#9aa285", "stroke-width":.78,opacity:.59});
  }

  function drawVegetableTextures() {
    const stipple = [[],[],[]];
    for(let i=0;i<690;i++){
      const x=between(-53,48), y=between(-151,3);
      stipple[i%3].push(fleck(x,y,between(.6,2.1),between(.6,2.0),x*.026));
    }
    ["#c2c987","#213e2e","#b2bd72"].forEach((fill,i) => path(id("leaf-grain"),stipple[i].join(""),{fill,opacity:[.28,.36,.26][i]}));
    const veins=[[],[]];
    for(let row=0;row<6;row++) {
      for(const side of [-1,1]) {
        for(let j=0;j<5;j++){
          const x=side*(8.5+j*5.6), y=-47-row*13.7-j*j*.53;
          const length=between(5,11), reach=side*between(1.5,5.8);
          veins[0].push(curve([[x,y],[x+reach*.25,y-length*.44],[x+reach,y-length]]));
          veins[1].push(curve([[x+1,y-1],[x+reach*.25+1,y-length*.44],[x+reach+.7,y-length]]));
        }
      }
    }
    path(id("leaf-grain"),veins[0].join(""),{stroke:"#344f36","stroke-width":.85,fill:"none",opacity:.42});
    path(id("leaf-grain"),veins[1].join(""),{stroke:"#b5c084","stroke-width":.6,fill:"none",opacity:.52});
    const dew = id("leaf-dew");
    [[291,289,2.6],[300,291,.95],[327,325,1.6],[263,350,2.0],[247,346,.95],[377,305,1.6],[328,347,2.1],[341,361,1.3]].forEach(([x,y,r]) => {
      ellipse(dew,x,y+.7,r,r*.83,{fill:"#3c5939",opacity:.72});
      ellipse(dew,x,y,r*.89,r*.68,{fill:"#a8bd7e",opacity:.89});
      ellipse(dew,x-r*.24,y-r*.26,r*.36,r*.22,{fill:"#e3e3ab"});
    });
    const radish = id("radish-fibres");
    for(let i=0;i<65;i++) {
      const a = i/65*tau+between(-.03,.03), start=between(.17,.78), end=between(.78,.95);
      const px = t => [Math.cos(a+.07*(1-t))*t*37, -1+Math.sin(a)*t*20.4];
      path(radish,curve([px(start),px((start+end)*.5),px(end)]), {stroke:i%3?"#e4af9e":"#fff0cc","stroke-width":between(.42,1.15),fill:"none",opacity:between(.36,.82)});
    }

  // Each small bundle follows its own hand-drawn cubic. Offset strands separate and
  // rejoin around the bends, with a darker submerged edge and broken highlights.
  function sampleCubic(control) {
    let [x,y]=control[0], distance=0;
    const result=[];
    for(let i=1;i<control.length;i++) {
      const [ax,ay,bx,by,ex,ey]=control[i];
      const steps=Math.ceil((Math.hypot(ax-x,ay-y)+Math.hypot(bx-ax,by-ay)+Math.hypot(ex-bx,ey-by))/3.6);
      for(let j=i===1?0:1;j<=steps;j++) {
        const t=j/steps,s=1-t;
        const px=s*s*s*x+3*s*s*t*ax+3*s*t*t*bx+t*t*t*ex;
        const py=s*s*s*y+3*s*s*t*ay+3*s*t*t*by+t*t*t*ey;
        const dx=3*s*s*(ax-x)+6*s*t*(bx-ax)+3*t*t*(ex-bx);
        const dy=3*s*s*(ay-y)+6*s*t*(by-ay)+3*t*t*(ey-by);
        const length=Math.hypot(dx,dy)||1;
        if(result.length) {
          const previous=result[result.length-1];
          distance+=Math.hypot(px-previous.x,py-previous.y);
        }
        result.push({x:px,y:py,nx:-dy/length,ny:dx/length,distance});
      }
      x=ex; y=ey;
    }
    return result;
  }

  function noodleOutline(points,widths,scale) {
    const top=[],bottom=[];
    for(let i=0;i<points.length;i++) {
      const prev=points[Math.max(0,i-1)],next=points[Math.min(i+1,points.length-1)];
      const dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;
      const w=widths[i]*scale/len, [x,y]=points[i];
      top.push([x-dy*w,y+dx*w]);bottom.unshift([x+dy*w,y-dx*w]);
    }
    return line([...top,...bottom])+"Z";
  }

          const shift=offset*fan+2.12*Math.sin(p.distance/24+phase)+.95*Math.sin(p.distance/9.2+phase);
          return [p.x+p.nx*shift,p.y+p.ny*shift];

    { phase:3.1, strength:1, points:[[512,352],[516,325],[506,297],[487,271],[480,249],[490,231],[514,212],[535,191],[537,170],[522,153],[499,141],[482,125],[484,109],[500,98],[526,89],[552,78],[565,59]] },
    { phase:5.3, strength:.72, points:[[641,359],[646,329],[642,297],[627,276],[620,257],[630,240],[654,230],[675,215],[682,197],[675,180],[654,167],[647,153],[650,140],[662,129]] }
  ];
  for (const plume of plumeData) {
    const group=add("g",{opacity:plume.strength},steam);
    plume.haze=path(group,"",{opacity:".25",filter:"url(#mist-diffuse)"});
    plume.sheet=path(group,"",{opacity:".29",filter:"url(#mist-soft)"});
    plume.fold=path(group,"",{opacity:".28",filter:"url(#mist-soft)"});
    plume.edge=path(group,"",{opacity:".20",filter:"url(#mist-edge)"});
    plume.filament=path(group,"",{opacity:".14",filter:"url(#mist-edge)"});
  }
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)");
  const pointer={x:500,y:400,aimX:0,aimY:0,lean:0,lift:0,gust:0,active:false};
  let time=0, last=0, frame=0, previousRipple=-1e5, lastRippleX=0, lastRippleY=0;
  const ripples=[];
  function ribbon(points,widths,offset,widthScale) {
    const a=[],b=[];
    for(let i=0;i<points.length;i++) {
      const prev=points[Math.max(i-1,0)],next=points[Math.min(i+1,points.length-1)];
      const dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len,w=widths[i],left=w*(offset-widthScale),right=w*(offset+widthScale);
      a.push([points[i][0]+nx*left,points[i][1]+ny*left]);
      b.unshift([points[i][0]+nx*right,points[i][1]+ny*right]);
    }
    return curve(a)+curve(b).replace(/^M/,"L")+"Z";
  }
  function paintSteam(t) {
    for(const plume of plumeData) {
      const widths=[], points=plume.points.map(([x,y],i,list)=>{
        const u=i/(list.length-1), envelope=Math.pow(Math.sin(u*Math.PI),.69);
        const sway=(3.5+12*u)*Math.sin(t*.39-u*5.9+plume.phase)+(2+6*u)*Math.sin(t*.59-u*9.6+plume.phase*.6);
        let draft=pointer.lean*(6+17*u)+pointer.gust*(3+9*u);
        if(pointer.active) {
          const dx=x-pointer.x,dy=y-pointer.y, influence=Math.exp(-(dx*dx+dy*dy)/14500);
          draft+=Math.tanh(dx/39)*influence*14;
        }
        const twist=.46+.54*Math.pow(Math.sin(u*6.6-t*.37+plume.phase),2);
        widths.push((1+13*envelope)*twist*(.88+.12*Math.cos(u*12.6-t*.49)));
        return [x+(sway+draft)*Math.pow(u,.65),y+envelope*(4.4*Math.sin(t*.44-u*8+plume.phase)+pointer.lift*2.7)];
      });
      const fold=points.map(([x,y],i)=>{
        const u=i/(points.length-1),spread=Math.sin(u*Math.PI);
        const turn=u*11.4+plume.phase+.38*Math.sin(t*.31-u*4);
        return [x+Math.sin(turn)*spread*(12+19*u),y+Math.cos(turn)*spread*10];
      });
      plume.haze.setAttribute("d",ribbon(points,widths,.24,2.25));
      plume.sheet.setAttribute("d",ribbon(points,widths,0,1.16));
      plume.fold.setAttribute("d",ribbon(fold,widths,-.05,.42));
      plume.edge.setAttribute("d",ribbon(points,widths,-.85,.18));
      plume.filament.setAttribute("d",ribbon(fold,widths,-.51,.10));
    }
  }

  const art=id("still-life"), reaction=id("water-reaction");
  function makeRipple(x,y) {
    if(ripples.length>=3) ripples.shift().node.remove();
    const node=add("g",{stroke:"#ffe3a1","stroke-width":1.05},reaction);
    const outer=ellipse(node,0,0,1,1,{});
    const inner=path(node,"",{stroke:"#f5c47b","stroke-width":.85});
    node.setAttribute("transform","translate("+round(x)+" "+round(y)+")");
    ripples.push({node,outer,inner,start:time});
    previousRipple=performance.now(); lastRippleX=x; lastRippleY=y;
  }
  function paintRipples() {
    for(let i=ripples.length-1;i>=0;i--) {
      const r=ripples[i],progress=(time-r.start)/1.48;
      if(progress>=1) { r.node.remove();ripples.splice(i,1);continue; }
      const ease=1-(1-progress)*(1-progress),w=2+ease*31,h=w*.34;
      r.outer.setAttribute("rx",round(w));r.outer.setAttribute("ry",round(h));
      r.inner.setAttribute("d","M"+coord([-w*.72,0])+"a"+coord([w*.72,h*.72])+" 0 0 0 "+coord([w*.92,h*.68]));
      r.node.setAttribute("opacity",round(.61*(1-progress)*Math.min(progress*11,1)));
    }
  }
  function animate(stamp) {
    if(reduced.matches||document.hidden) { setMotion();return; }
    frame=requestAnimationFrame(animate);
    if(!last) last=stamp;
    const elapsed=(stamp-last)/1000;
    if(elapsed<1/30) return;
    const dt=Math.min(elapsed,.09);
    last=stamp; time+=dt;
    const ease=1-Math.exp(-dt*3.6);
    pointer.lean+=(pointer.aimX-pointer.lean)*ease;
    pointer.lift+=(pointer.aimY-pointer.lift)*ease;
    pointer.gust*=Math.exp(-dt*2.5);
    if(Math.abs(pointer.lean)+Math.abs(pointer.lift)>.003) {
      const shift="translate("+round(pointer.lean*2.7)+" "+round(pointer.lift*1.25)+")";
      if(art.getAttribute("transform")!==shift) {
        art.setAttribute("transform",shift);steam.setAttribute("transform",shift);
      }
    } else if(art.hasAttribute("transform")) {
      art.removeAttribute("transform");steam.removeAttribute("transform");
    }
    paintSteam(time);
    if(ripples.length) paintRipples();
  }
  function setMotion() {
    if(frame) cancelAnimationFrame(frame);
    frame=0;last=0;
    if(reduced.matches) {
      Object.assign(pointer,{aimX:0,aimY:0,lean:0,lift:0,gust:0,active:false});
      ripples.splice(0).forEach(r=>r.node.remove());
      art.removeAttribute("transform");steam.removeAttribute("transform");time=0;paintSteam(0);
    } else if(!document.hidden) {
      paintSteam(time);frame=requestAnimationFrame(animate);
    }
  }
  function trackPointer(event) {
    if(reduced.matches) return;
    const matrix=scene.getScreenCTM();
    if(!matrix) return;
    const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());
    if(pointer.active) pointer.gust=clamp(pointer.gust+(point.x-pointer.x)*.017,-1.4,1.4);
    pointer.active=true;pointer.x=point.x;pointer.y=point.y;
    pointer.aimX=clamp((point.x-500)/390,-1,1);pointer.aimY=clamp((point.y-400)/310,-1,1);
    const inBroth=((point.x-500)/330)**2+((point.y-408)/112)**2<1;
    if(inBroth&&performance.now()-previousRipple>490&&(event.type==="pointerdown"||Math.hypot(point.x-lastRippleX,point.y-lastRippleY)>16)) makeRipple(point.x,point.y);
  }
  function releasePointer() { pointer.active=false;pointer.aimX=0;pointer.aimY=0; }
  window.addEventListener("pointermove",trackPointer,{passive:true});
  window.addEventListener("pointerdown",trackPointer,{passive:true});
  window.addEventListener("pointerup",event=>{if(event.pointerType!=="mouse") releasePointer();},{passive:true});
  document.documentElement.addEventListener("pointerleave",releasePointer);
  window.addEventListener("pointercancel",releasePointer);
  window.addEventListener("blur",releasePointer);
  document.addEventListener("visibilitychange",setMotion);
  if(reduced.addEventListener) reduced.addEventListener("change",setMotion);
  else reduced.addListener(setMotion);
  setMotion();
})();
</script>
</body>
</html>
